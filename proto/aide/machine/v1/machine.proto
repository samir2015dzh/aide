syntax = "proto3";

package aide.machine.v1;

import "google/protobuf/timestamp.proto";
import "aide/identity/v1/identity.proto";
import "aide/options/v1/options.proto";
import "aide/session/v1/session.proto";

// MachineService is served by every machine over E2E tunnels.
service MachineService {
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // Watch sends the caller's view of this machine (the sessions it may
  // read, its projects, the machine's state), then each change, until the
  // caller leaves (docs/state-sync.md §3.3). The first message comes at
  // once, carrying only what changed since resume_token, so the caller
  // knows the watch is in place.
  rpc Watch(WatchRequest) returns (stream WatchResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // PullWork sends the work this machine counted that changed since
  // after, for the keys the caller may read: whole hours, keys and
  // sessions. Owner devices keep a copy (docs/work-stats.md §6).
  rpc PullWork(PullWorkRequest) returns (PullWorkResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // MachineAdminService.ListDSHSessions for an agent too (docs/cli.md):
  // a grant that sees all sessions (TASK_VISIBILITY_ALL) sees those DSH
  // sessions whose folder is in a project it covers (every one with all
  // projects); one that sees its own sessions sees none, as no DSH session
  // is an agent's own. Read only: nothing here sends one a message.
  rpc ListDSHSessions(ListDSHSessionsRequest) returns (ListDSHSessionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // MachineAdminService.ReadDSHSession, of a session Aide did not start
  // in a folder where ListDSHSessions shows the caller sessions; NOT_FOUND
  // for any other.
  rpc ReadDSHSession(ReadDSHSessionRequest) returns (ReadDSHSessionResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // MachineAdminService.SendDSHMessage for an agent: only to a DSH session
  // it may read (as ReadDSHSession) that the owner took over
  // (SetDSHTakeover); the message is shown as the agent's. Nothing else
  // an agent does reaches a DSH session.
  rpc SendDSHMessage(SendDSHMessageRequest) returns (SendDSHMessageResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // MachineAdminService.DSHSessionOptions, on the same terms.
  rpc DSHSessionOptions(DSHSessionOptionsRequest) returns (DSHSessionOptionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // MachineAdminService.ListClaudeSessions for an agent, for its roster
  // (docs/agent-messages.md §15.4; the owner's ruling of 2026-11-22): the
  // Claude app's sessions as ListDSHSessions shows DSH's, to a grant that
  // sees all sessions, in the projects it covers. No index folders. Their
  // conversations stay the owner's to read: nothing here reads one.
  rpc ListClaudeSessions(ListClaudeSessionsRequest) returns (ListClaudeSessionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
}

message WatchRequest {
  // From the last message applied; empty: start fresh.
  bytes resume_token = 1;
  // A fresh start sends what ListSessions' first page holds: the newest
  // limit sessions (0: 50) and every unsettled one.
  uint32 limit = 2;
  aide.session.v1.SessionView view = 3;
  // The sent_at of the last message applied, as the machine sent it. If
  // resume_token is refused (the machine started again), the reset also
  // carries the sessions deleted since then.
  google.protobuf.Timestamp held_at = 4;
}

message WatchResponse {
  // Set on the first message of a fresh start, or when resume_token was
  // refused: replace everything held of this machine.
  bool reset = 1;
  // Added or changed.
  repeated aide.session.v1.Session sessions = 2;
  repeated string deleted_session_ids = 3;
  // With reset: where older sessions start (ListSessions before).
  aide.session.v1.SessionCursor next = 4;
  // Added or changed (without base), and removed.
  repeated Project projects = 5;
  repeated string removed_project_ids = 6;
  // With the first message, and when it changed.
  MachineStatus status = 7;
  // Every message: resume from here.
  bytes resume_token = 8;
  // Every message: the machine's clock when it sent it (for held_at).
  google.protobuf.Timestamp sent_at = 9;
  // Every message: where the machine's counts of work are (PullWork).
  uint64 work_seq = 10;
}

message PullWorkRequest {
  // The store the caller holds (empty: none) and the seq it holds.
  bytes store = 1;
  uint64 after = 2;
  // With after 0: only hours from this one on (unix seconds / 3600), for a
  // device that keeps less history than the machine.
  int64 from_hour = 3;
}

message PullWorkResponse {
  // Another than the request's: drop what you hold of this machine first.
  bytes store = 1;
  // This answer brings the caller up to seq; with more, ask again from it.
  uint64 seq = 2;
  bool more = 3;
  repeated WorkKey keys = 4;
  repeated WorkSession sessions = 5;
  // Each replaces what the caller holds of that hour.
  repeated WorkHour hours = 6;
}

// Who did work: the client (who started a session, or asked for a turn),
// the coding agent and the project.
message WorkKey {
  uint32 key = 1;
  string client = 2;
  string agent = 3;
  string project_id = 4;
}

message WorkSession {
  uint32 session = 1;
  // Its key: who started it.
  uint32 key = 2;
  aide.session.v1.SessionStatus status = 3;
  // Its last turn failed (not an interruption).
  bool failed = 4;
}

message WorkHour {
  // Unix seconds / 3600.
  int64 hour = 1;
  repeated WorkPresence presence = 2;
  repeated WorkMeasure measures = 3;
}

// A session at work (a turn in progress) in a quarter of the hour (0-3).
message WorkPresence {
  uint32 quarter = 1;
  uint32 key = 2;
  uint32 session = 3;
}

// What turns of one key did in a quarter of the hour (0-3): those that
// ended there, of them failed, their tokens, and the seconds turns were in
// progress there.
message WorkMeasure {
  uint32 quarter = 1;
  uint32 key = 2;
  uint32 turns = 3;
  uint32 failed_turns = 4;
  uint64 input_tokens = 5;
  uint64 output_tokens = 6;
  uint32 busy_seconds = 7;
}

message GetInfoRequest {
  // An owner's device asks the machine to check its coding agents again
  // now (installed, version, signed in), and waits for it: Check Again.
  bool recheck = 1;
  // With recheck, the owner rescans on purpose: a hidden agent that now
  // runs where it did not when hidden, or is found elsewhere, shows again.
  bool rescan_hidden = 2;
}

message GetInfoResponse {
  string machine_id = 1;
  string machine_name = 2;
  MachineStatus status = 3;
}

// A machine's state, for those it lets in end to end (agents and the
// owner's devices); the relay never sees it.
message MachineStatus {
  string name = 12;
  uint32 protocol_version = 1;
  string platform = 2;
  repeated AgentStatus agents = 3;
  uint32 running_sessions = 4;
  uint32 max_sessions = 5;
  bool paused = 6;
  string version = 7;
  // Live sessions by status: "queued", "preparing", "running", "idle", ...
  map<string, uint32> sessions = 9;
  reserved 8, 10, 11;
  reserved "host", "agent_processes", "started_at";
  // What keeps this machine from working as it should (none while healthy),
  // so every screen of the owner can say what is wrong and how to fix it.
  repeated MachineProblem problems = 13;
  // Her on this machine. Sent to the owner's
  // devices only, never to agents.
  HerStatus her = 14;
  // Computer Control on this machine (docs/computer-control.md). Sent to
  // the owner's devices only, never to agents.
  ScreenStatus screen = 15;
  // Direct LAN IPv4 / public IPv6 E2E tunnel endpoints (host:port) for
  // bypassing the relay when reachable. Sent to the owner's devices only.
  repeated string direct_addrs = 16;
  // The rooms this machine hosts (docs/rooms.md), as the roster shows them:
  // each with its state, last line and what the owner has not read; without
  // their charters. A change to one sends the status again, so the owner's
  // devices follow rooms on the Watch they have, asking nothing. Sent to the
  // owner's devices only.
  repeated Room rooms = 17;
  // What this machine's coding agents said for rooms another machine hosts
  // that the post office still holds for that host (工单 #74): the host is
  // offline, so the owner's devices can show they wait to come in. Sent to
  // the owner's devices only.
  repeated RoomOutbox room_outbox = 18;
  // Open model data sync status (工单 #114: models.dev + litellm).
  ModelCatalogSync model_catalog = 19;
}

// RoomOutbox is what waits at the post office for a room's host: replies
// of this machine's coding agents, sent while the host was away.
message RoomOutbox {
  string room_id = 1;
  string host_machine_id = 2;
  uint32 replies = 3;
  // When the oldest of them was sent.
  google.protobuf.Timestamp since = 4;
}

// ModelCatalogSync reports the open model catalog's cache/sync state on this
// machine (工单 #114): failures are recorded here and in logs without
// disturbing discovery or the owner.
message ModelCatalogSync {
  // "snapshot" (built-in fallback), "cache" (persisted), or "synced".
  string source = 1;
  uint32 model_count = 2;
  google.protobuf.Timestamp synced_at = 3;
  google.protobuf.Timestamp last_attempt_at = 4;
  // Empty when the last sync succeeded or none has run yet.
  string last_error = 5;
}

// ScreenStatus is whether the owner's devices can see and operate this
// machine's screen (aide.screen.v1.ScreenService).
message ScreenStatus {
  // The machine is a Mac and has the helper that captures its screen.
  bool available = 1;
  // The device in control now, as it named itself; empty when none is.
  string viewer = 2;
  // The machine takes a viewer's candidates after its offer
  // (ScreenService.Candidates): the offer need not wait for them.
  bool candidates_later = 3;
}

// HerStatus is Her on a machine, as its aided last saw her.
message HerStatus {
  // The owner turned Her on for this machine (SetHer): set by an aided from
  // before Aide dropped Her.
  bool enabled = 1;
  // Why this machine can't run Her: "removed" from every aided since Aide
  // dropped her ("windows", "no her" from older ones).
  string unsupported = 5;
  // Her was on here once and her data is still on the machine: it can be
  // erased (SetHer erase).
  bool data = 11;
  // What an aided with Her said of her.
  reserved 2, 3, 4, 6, 7, 8, 9, 10, 12;
  reserved "running", "version", "model_ready", "unread", "latest", "error",
    "client_public_key", "mesh", "methods";
}

message MachineProblem {
  MachineProblemKind kind = 1;
  // PROCESSES and FILES: how many are in use, out of how many; DISK: bytes
  // free, out of the disk's size.
  uint64 used = 2;
  uint64 limit = 3;
  // PROCESSES: the program whose ended processes nobody reaped hold most of
  // them (its name), and how many it holds.
  string culprit = 4;
  uint32 culprit_count = 5;
  // What went wrong, as the system said it (SHELL_PATH: why the login
  // shell's PATH could not be read).
  string detail = 6;
}

enum MachineProblemKind {
  MACHINE_PROBLEM_KIND_UNSPECIFIED = 0;
  // The user's processes are at (or near) their limit: no new program can
  // start, so no coding agent can.
  MACHINE_PROBLEM_KIND_PROCESSES = 1;
  // The disk with Aide's data is nearly full: worktrees and the session
  // store can't grow.
  MACHINE_PROBLEM_KIND_DISK = 2;
  // aided is near its limit of open files.
  MACHINE_PROBLEM_KIND_FILES = 3;
  // The login shell's PATH could not be read, so agents installed where
  // only it says (nvm, npm, …) are not found.
  MACHINE_PROBLEM_KIND_SHELL_PATH = 4;
}

message AgentStatus {
  string name = 1;
  bool available = 2;
  string version = 3;
  bool logged_in = 4;
  reserved 5;
  reserved "sandbox_available";
  string detail = 6;
  // A check of this agent is under way; the rest is what the last check
  // found, if any (an agent never checked yet is not available).
  bool checking = 7;
  // The models it offers, to pick defaults from (Claude Code and Codex;
  // an ACP agent's, as its last new session here offered them).
  repeated AgentModel models = 8;
  // What its sessions here run with when the client names no model.
  aide.identity.v1.AgentDefaults defaults = 9;
  // Its own configuration, which empty defaults follow, as far as the
  // agent tells it (Codex).
  aide.identity.v1.AgentDefaults own = 10;
  // Why it is not available (detail: what the system or the agent said).
  AgentProblem problem = 11;
  // Where it was found, when it was.
  string binary = 12;
  // Scoped ACP observations. These are not machine-wide model entitlements;
  // a session's own config options remain authoritative. Empty on older peers.
  repeated AgentModelCatalog model_catalogs = 13;
  // The session modes it offers: an ACP agent's permission or approval
  // presets, as its last new session here offered them.
  repeated AgentMode modes = 14;
  // One the owner added on this machine (ListCustomAgents).
  bool custom = 15;
  // Claude plan usage read on this machine (Claude Code only, else unset),
  // for the scheduler to pace work by. Read from the signed-in Claude
  // Desktop's token here; the token never leaves the machine, only these
  // windows' utilization and reset times are reported.
  ClaudeUsage usage = 16;
  // The owner hid it (SetAgentHidden): the apps leave it out of the lists,
  // and say how many are hidden, to show again.
  bool hidden = 17;
  // The owner paused it here (SetAgentPaused): no new session starts with
  // it until it resumes. Unset: not paused; resume_at unset: until the
  // owner resumes it; set: it resumes by itself then.
  AgentPause pause = 18;
  // When it last resumed by itself (a pause's resume_at came), to show.
  google.protobuf.Timestamp auto_resumed_at = 19;
  // When the check the rest says came from ended: what the owner's screens
  // show as "checked at", and past which they call it unknown instead of
  // passing an old finding off as now. Unset: never checked.
  google.protobuf.Timestamp checked_at = 20;
  // Claude only: the Claude desktop app on this machine, apart from the
  // command line tool (logged_in is the command line's own sign-in, which
  // the app's does not give it).
  ClaudeDesktop desktop = 21;
  // DSH ("deepseek") only: the Aide bridge plugin in DSH Desktop, as the
  // same check found it.
  DSHBridge dsh_bridge = 22;
  // Its sign-in started from Aide (StartAgentLogin), the last one or the
  // one under way; unset: none since aided started.
  AgentLogin login = 23;
  // The kind the owner filed it as (SetAgentCategory, 工单 #52/#93): "" told
  // from what it is (a coding agent of this machine), "local" a coding agent
  // of this machine, "personal" listed with the personal agents. The owner's
  // say comes first, whatever the machine finds.
  string category = 24;
  // logged_in is unset because the check could not tell (工单 #108: Claude
  // Code's `claude auth status` gave no clear answer): its sign-in is
  // unconfirmed, not signed out. Never filled from another sign-in (the
  // Claude desktop app's is its own, desktop.signed_in).
  bool login_unconfirmed = 25;
  // Truthful capability declaration for this provider on this machine (工单 #110 / #112):
  // UI hides or disables unsupported entries (fork, rollback, steer, in-app login, etc.)
  // instead of exposing dead buttons that only fail when clicked.
  AgentCapabilities capabilities = 26;
  // Where this agent came from on this machine: "builtin", "registry" (official ACP
  // registry install), or "local" (owner-supplied local ACP command).
  string source = 27;
  // Official ACP registry agent id and version when source == "registry".
  string registry_id = 28;
  string registry_version = 29;
  // Negotiated ACP protocol version (e.g. 2 or 1) from the latest handshake/session; 0 if unknown/non-ACP.
  uint32 protocol_version = 30;
}

// AgentCapabilities declares what a provider truly supports on this machine
// (工单 #110 / #112). Clients gate UI affordances directly from these flags.
message AgentCapabilities {
  bool select_model = 1;
  bool switch_model_in_session = 2;
  bool select_effort = 3;
  bool select_mode = 4;
  bool login_in_aide = 5;
  bool usage = 6;
  bool fork = 7;
  bool rollback = 8;
  bool steer = 9;
  bool resume = 10;
  bool images = 11;
  bool audio = 12;

}
// AgentLogin is a sign-in of a coding agent's command line that Aide
// started on the machine (工单 #51).
message AgentLogin {
  AgentLoginState state = 1;
  // Why it failed, in the words of what failed (no token, no URL path).
  string detail = 2;
  google.protobuf.Timestamp started_at = 3;
  google.protobuf.Timestamp ended_at = 4;
  // The address its sign-in prints for the owner to open (工单 #118): on any
  // device, not only that machine, where no browser may open. Empty until
  // it printed one. Sent to the owner's own devices only, never kept.
  string url = 5;
  // The code the owner pasted from the page that address leads to has been
  // given to the sign-in; it is checking it.
  bool code_sent = 6;
}

enum AgentLoginState {
  AGENT_LOGIN_STATE_UNSPECIFIED = 0;
  // Under way: starting, then (url) waiting for the owner to open its
  // address and give back the code it shows (工单 #118).
  AGENT_LOGIN_STATE_WAITING = 1;
  // Done, and the agent checked again says it is signed in.
  AGENT_LOGIN_STATE_SUCCEEDED = 2;
  // It ended without the agent signed in (detail says what it said).
  AGENT_LOGIN_STATE_FAILED = 3;
  // The owner cancelled it.
  AGENT_LOGIN_STATE_CANCELLED = 4;
  // Not finished in time; stopped.
  AGENT_LOGIN_STATE_TIMED_OUT = 5;
}

message StartAgentLoginRequest {
  // "claude" (the only one so far).
  string agent = 1;
  // Stop the one under way.
  bool cancel = 2;
  // The code the page at its url showed, for the one under way (工单 #118).
  string code = 3;
}

message StartAgentLoginResponse {
  AgentLogin login = 1;
}

// ClaudeDesktop is the Claude desktop app, as aided finds it.
message ClaudeDesktop {
  // Its settings are on this machine: it is installed, or was.
  bool installed = 1;
  // It is signed in (its settings say so; the token is never read).
  bool signed_in = 2;
}

// AgentPause is an agent paused on a machine.
message AgentPause {
  google.protobuf.Timestamp since = 1;
  google.protobuf.Timestamp resume_at = 2;
}

// ClaudeUsage is the Claude plan usage (docs/claude-usage.md): the hard
// caps the scheduler has to stay under. aided reads it on the machine from
// the account's OAuth token (standard Claude Code credentials, else the
// signed-in Claude Desktop's token cache), calls Anthropic's usage
// endpoint, and caches the reading. The token and its refresh token are
// used only in aided's memory on the machine and never leave it: nothing
// here carries the token, only the windows and when they reset.
message ClaudeUsage {
  // Each window Anthropic reports: "five_hour", "seven_day", and the
  // model-specific weekly caps when present ("seven_day_opus", ...). A
  // window the account has none of is left out (the UI tolerates gaps).
  repeated UsageWindow windows = 1;
  // When aided last fetched a fresh reading.
  google.protobuf.Timestamp fetched_at = 2;
  // The reading is the last good one and the latest fetch failed, so the
  // numbers may be behind.
  bool stale = 3;
  // Why there is no reading at all, or empty when windows are present:
  // "signed_out" (no signed-in token found), "no_token" (a token was found
  // but could not be read), "api_error" (the endpoint failed),
  // "parse_error" (the endpoint answered, but not with a JSON object),
  // "unsupported" (this OS can't open the token cache). Shown as "读不到".
  string unavailable = 4;
  // The last auto-renew outcome, or empty when none was needed:
  // "renewed" (the access token was refreshed and the cache rewritten),
  // "renew_failed" (refresh or write-back failed; the owner may need to
  // sign in to Claude Desktop again). A failed renew never leaves the
  // Desktop cache unreadable: aided restores the old entry.
  string renew = 5;
  // What lies behind an unavailable reading, or behind the last refresh
  // that failed while a stale reading is kept: one line for the diagnosis,
  // e.g. "HTTP 401: authentication_error: OAuth token has expired" or the
  // transport error with its host. Never a token, a header or a URL path.
  string detail = 6;
  // Where the reading came from (工单 #86): "claude_code" (this machine's
  // Claude Code answered /usage itself), "api" (the usage endpoint asked
  // with the token found here, the fallback). Empty with no reading.
  string source = 7;
}

// UsageWindow is one rate-limit window's reading: how full it is (0-100)
// and when it resets.
message UsageWindow {
  string key = 1;
  double utilization = 2;
  google.protobuf.Timestamp resets_at = 3;
}

message AgentModelCatalog {
  // project/session address, or "isolated" for a probe with no project data.
  string scope = 1;
  // acp_initialize, acp_options, acp_session, or acp_update.
  string source = 2;
  // known (including zero models), unknown, session_required, auth_required,
  // timeout, or error. Failures can retain an expired previous observation.
  string state = 3;
  repeated AgentModel models = 4;
  // Initial selection of a NEW session, before Aide applies overrides.
  // Never inferred from a resumed session or subsequent model changes.
  string default_model = 5;
  string current_model = 6;
  int64 observed_at_unix_ms = 7;
  int64 expires_at_unix_ms = 8;
}

enum AgentProblem {
  AGENT_PROBLEM_UNSPECIFIED = 0;
  AGENT_PROBLEM_NOT_FOUND = 1;
  // Its desktop app is installed but not the command line tool Aide
  // runs (detail: the app).
  AGENT_PROBLEM_APP_WITHOUT_CLI = 2;
  // Found, but it could not start: the machine can't start new programs.
  AGENT_PROBLEM_NO_PROCESSES = 3;
  // Found, but it did not answer in time.
  AGENT_PROBLEM_TIMED_OUT = 4;
  // Found, but what runs it is missing (detail: e.g. "node").
  AGENT_PROBLEM_MISSING_RUNTIME = 5;
  // Found, but it failed (detail: the first line it printed).
  AGENT_PROBLEM_FAILED = 6;
}

message AgentModel {
  // What the agent takes as its model (e.g. "opus", "gpt-6-astra").
  string id = 1;
  string name = 2;
  // The reasoning efforts it supports.
  repeated string efforts = 3;
  // The specific model the id runs here when the id is an alias (工单 #99:
  // Claude Code's "opus" → "claude-opus-5-5", as Claude Code itself
  // resolves it on this machine for this account); empty when the id is the
  // model itself, or the agent did not say.
  string resolved = 4;
  // Where its agent offers it from, when it says (工单 #98 补充: DSH's
  // provider, e.g. "DeepSeek"; each provider line the same model comes by,
  // " · " between, as it is listed once).
  string source = 5;
  // Enriched from open model data (工单 #114: models.dev + litellm) on exact
  // model match only; zero/empty when the discovered model is not in the catalog.
  uint32 context_window = 6;
  uint32 max_output_tokens = 7;
  repeated string capabilities = 8;
  // Reference USD price per 1M tokens for cost estimation only (never billing).
  double input_cost_per_million = 9;
  double output_cost_per_million = 10;
}

message AgentMode {
  // What the agent takes as the mode (e.g. "default", "plan").
  string id = 1;
  string name = 2;
}

message ListProjectsRequest {}

message Project {
  string project_id = 1;
  // Only for WORKSPACE_WORKTREE projects.
  string default_base_ref = 2;
  aide.identity.v1.Workspace workspace = 3;
  // The project directory on the machine.
  string path = 4;
  // What the project is, in the owner's words.
  string description = 5;
  // What a new session's worktree starts from: the default base ref, with
  // HEAD resolved to the branch checked out now (or its short commit).
  // Worktree projects only.
  string base = 6;
  // Sessions with a turn in progress in this project (queued, running, or
  // waiting for an answer).
  uint32 active_sessions = 7;
  // The coding agents that may work in it; empty: all.
  repeated string agents = 8;
  // The name the owner gave it (SetProjectName); empty: shown by its id.
  string name = 9;
  // The DSH permission preset its DSH sessions start with unless one is
  // chosen for the session (SetProjectPermission); empty: DSH's own.
  string dsh_preset = 10;
}

message ListProjectsResponse {
  repeated Project projects = 1;
}

// MachineOpsService runs one-shot commands on the machine for an agent
// whose grant has machine_exec (docs/machine-ops.md). The machine keeps
// each call, refused ones too, in its ops log (ListExecLog); the relay
// only carries it, end to end.
service MachineOpsService {
  rpc Exec(ExecRequest) returns (ExecResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
}

message ExecRequest {
  // Run by PowerShell on Windows (powershell -NoProfile -NonInteractive
  // -Command), by sh -c elsewhere, with a new terminal's environment.
  string command = 1;
  // Where it runs: "~/app" or a full path; empty: the home folder.
  string workdir = 2;
  // It is ended after this long: default 60 s, at most 600 s.
  uint32 timeout_seconds = 3;
}

message ExecResponse {
  // -1 when it was ended (timed_out).
  int32 exit_code = 1;
  // Each at most 1 MiB, as UTF-8; what came after is dropped.
  string stdout = 2;
  string stderr = 3;
  bool stdout_truncated = 4;
  bool stderr_truncated = 5;
  bool timed_out = 6;
  google.protobuf.Timestamp started_at = 7;
  google.protobuf.Timestamp ended_at = 8;
  // "powershell" or "sh".
  string shell = 9;
  // The full path it ran in.
  string workdir = 10;
}

enum ExecOutcome {
  EXEC_OUTCOME_UNSPECIFIED = 0;
  // It ran and exited by itself, with exit_code.
  EXEC_OUTCOME_EXITED = 1;
  // It ran past its timeout and was ended.
  EXEC_OUTCOME_TIMED_OUT = 2;
  // The machine turned the call away (reason): the grant lacks
  // machine_exec, the machine is paused, a bad request.
  EXEC_OUTCOME_REFUSED = 3;
  // It could not start (reason): no such folder, no shell.
  EXEC_OUTCOME_FAILED = 4;
}

// ExecRecord is one call of Exec in the machine's ops log: who asked, what,
// where and when, and how it ended; never its output.
message ExecRecord {
  string client_id = 1;
  // The agent's name, from its grant.
  string client_label = 2;
  string command = 3;
  string workdir = 4;
  google.protobuf.Timestamp started_at = 5;
  google.protobuf.Timestamp ended_at = 6;
  ExecOutcome outcome = 7;
  int32 exit_code = 8;
  string reason = 9;
}

// MachineAdminService is only available to the owner device principal.
service MachineAdminService {
  // Rooms (ROOMS-DESIGN-2026-11-22, G2-a): the owner and bots talking, kept
  // and run by this machine, the room's host. A direct room is the owner and
  // one personal agent: its conversation. Owner only.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // The direct room with a personal agent, made the first time.
  rpc OpenDirectRoom(OpenDirectRoomRequest) returns (Room) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc ListRoomMessages(ListRoomMessagesRequest) returns (ListRoomMessagesResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // The owner says something in the room; the members it is for are woken.
  // Sent again with the same idempotency key, it is not said twice.
  rpc PostRoomMessage(PostRoomMessageRequest) returns (RoomMessage) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // A room of several bots (G2-b): the personal agents and this machine's
  // coding agents the owner picked, each coding agent in a project of its
  // own here.
  rpc CreateRoom(CreateRoomRequest) returns (Room) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Its name, how it is run, its round limit.
  rpc UpdateRoom(UpdateRoomRequest) returns (Room) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Stops a round table: nobody more is woken, coding agents at work are
  // interrupted, answers that come after are kept but hand nothing on.
  rpc StopRoom(StopRoomRequest) returns (Room) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // The owner read the room up to now.
  rpc MarkRoomSeen(MarkRoomSeenRequest) returns (Room) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc DeleteRoom(DeleteRoomRequest) returns (DeleteRoomResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc ApplyAdminCommand(ApplyAdminCommandRequest) returns (ApplyAdminCommandResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc PushRevocations(PushRevocationsRequest) returns (PushRevocationsResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // The git repositories under the home folder, for Add a Project: read
  // when the person opens it, never kept (docs/onboarding.md §5.5).
  rpc ListRepos(ListReposRequest) returns (ListReposResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // The folders in one folder, for Add a Project's folder browser: read
  // when the person opens it, never kept.
  rpc ListFolders(ListFoldersRequest) returns (ListFoldersResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // One short fixed turn of a coding agent in a scratch folder, to prove it
  // is installed and signed in: no session, project or grant is involved.
  // Signs a coding agent's command line in on this machine (Claude Code:
  // `claude auth login`), started here in the background: the browser
  // opens on this machine and the owner signs in there. Aide never sees
  // the account, the password or the token (工单 #51). Again while one is
  // under way: its state; cancel stops it.
  rpc StartAgentLogin(StartAgentLoginRequest) returns (StartAgentLoginResponse) {
    option idempotency_level = IDEMPOTENT;
  }
  rpc TestAgent(TestAgentRequest) returns (TestAgentResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // The machine's ops log (MachineOpsService), newest first.
  rpc ListExecLog(ListExecLogRequest) returns (ListExecLogResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // The sessions DeepSeek Harness (DSH) keeps on this machine that Aide
  // did not start (the owner's own in DSH Desktop, another tool's), newest
  // activity first: read from DSH's files, which nothing here writes, and
  // without taking a session's lock. Not its subagents' sessions.
  rpc ListDSHSessions(ListDSHSessionsRequest) returns (ListDSHSessionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // One DSH session and a page of its conversation as DSH saved it, as
  // session events (as SessionService.ListEvents pages them). Read only.
  rpc ReadDSHSession(ReadDSHSessionRequest) returns (ReadDSHSessionResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // The Claude Code sessions the Claude desktop app lists on this machine
  // (its own index), that Aide did not start, newest activity first: read
  // from the app's and Claude Code's files, which nothing here writes.
  // Owner only.
  // The models (with their reasoning efforts) and permission presets DSH
  // offers a taken-over session, and the ones it has now, through the
  // bridge plugin: what SendDSHMessage may set.
  rpc DSHSessionOptions(DSHSessionOptionsRequest) returns (DSHSessionOptionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  rpc ListClaudeSessions(ListClaudeSessionsRequest) returns (ListClaudeSessionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // One of them and a page of its conversation, from Claude Code's
  // transcript, as session events. Read only. Owner only.
  rpc ReadClaudeSession(ReadClaudeSessionRequest) returns (ReadClaudeSessionResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // Messages held for the owner before they reach a session
  // (docs/agent-messages.md §15.5): from an agent let in less than 7 days
  // ago, in a chain at hop 3 or more, or matching the owner's information
  // boundary for the session's agent. Kept on this machine, not at the
  // post office; one not released within a day expires. Owner only.
  rpc ListHeldMessages(ListHeldMessagesRequest) returns (ListHeldMessagesResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // Releases one to its session (it goes on as if never held), or discards
  // it (refused; its sender is told). Only messages, never an action: a
  // release is recorded in the audit log.
  rpc ReleaseHeldMessage(ReleaseHeldMessageRequest) returns (ReleaseHeldMessageResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Taking over a DSH session (docs/dsh-takeover.md): the owner turns it
  // on for one session (off for every session until then), then sends it
  // messages and stops its turn through the Aide bridge plugin in DSH
  // Desktop, which hands them to the DSH Host that owns the session: a
  // message sent while a turn runs waits for the next turn there, as one
  // typed in DSH would. Owner only. Turning it off changes nothing in DSH.
  rpc SetDSHTakeover(SetDSHTakeoverRequest) returns (SetDSHTakeoverResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Sends the owner's message into a taken-over DSH session.
  // FAILED_PRECONDITION, with what to do, when takeover is off, the bridge
  // is not running (DSH Desktop closed, or the plugin not installed or
  // off), or another DSH process holds the session; DEADLINE_EXCEEDED
  // when DSH did not take it in time. Nothing is sent then.
  rpc SendDSHMessage(SendDSHMessageRequest) returns (SendDSHMessageResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Stops the current turn of a taken-over DSH session that runs in DSH
  // Desktop.
  rpc InterruptDSHSession(InterruptDSHSessionRequest) returns (InterruptDSHSessionResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Prepares installing the bridge plugin, which DSH Desktop's own plugin
  // manager then does (Plugins page): backs up DSH's configuration files
  // and writes the plugin's package into the DSH home. Changes nothing DSH
  // reads. Owner only.
  rpc PrepareDSHBridge(PrepareDSHBridgeRequest) returns (PrepareDSHBridgeResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Installs the bridge plugin by handing it to DSH (工单 #59): prepares the
  // package as PrepareDSHBridge does, then starts a DSH session in the
  // plugin's folder whose task is to install it in DSH Desktop's profile,
  // find and clear what stops it (a file a running program holds, a broken
  // package left by an earlier failure), restart DSH Desktop, check the
  // plugin answers, and report with `aided dsh-bridge report`. How it goes
  // is DSHBridge.install. Owner only.
  rpc InstallDSHBridge(InstallDSHBridgeRequest) returns (InstallDSHBridgeResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // The coding agents the owner added on this machine (custom agents):
  // ACP agents started with the command given, listed and run as the
  // built-in ones are. Kept in the machine's agents.json; the values of
  // secret variables are in its credential store and never sent back.
  rpc ListCustomAgents(ListCustomAgentsRequest) returns (ListCustomAgentsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // Adds a custom agent, or changes the one by that name; in use at once.
  rpc SaveCustomAgent(SaveCustomAgentRequest) returns (SaveCustomAgentResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc RemoveCustomAgent(RemoveCustomAgentRequest) returns (RemoveCustomAgentResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Starts an agent as given (saved or not) once, in a scratch folder, and
  // does the ACP handshake: initialize, then a new session; then stops it.
  rpc TestCustomAgent(TestCustomAgentRequest) returns (TestCustomAgentResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // Lists installable agents from the official ACP Registry (with local cache
  // and bundled snapshot fallback), annotated for this machine's OS/arch and
  // current installation status (工单 #110).
  rpc ListACPRegistry(ListACPRegistryRequest) returns (ListACPRegistryResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // Downloads (with SHA-256 verification for binary archives), installs in a
  // machine-isolated directory, and registers an official ACP Registry agent
  // as a custom ACP agent on this machine (工单 #110).
  rpc InstallACPRegistryAgent(InstallACPRegistryAgentRequest) returns (InstallACPRegistryAgentResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
}

// CustomAgent is a coding agent the owner added on a machine: an ACP agent
// (JSON-RPC on stdio) started as command args, with env added to a new
// terminal's environment.
message CustomAgent {
  // How Aide and the owner's agents name it: lower case letters, digits
  // and "-", none of the built-in agents' names.
  string name = 1;
  // A program on the machine's PATH, or its full path.
  string command = 2;
  repeated string args = 3;
  repeated AgentEnv env = 4;
  // The folder its process starts in; empty: the session's own folder.
  // The session's folder is what the agent is told to work in either way.
  string dir = 5;
  // Origin of this custom ACP agent: "local" (owner command) or "registry" (official ACP Registry).
  string source = 6;
  string registry_id = 7;
  string registry_version = 8;
  // How it is launched/installed: "local", "binary", "npx", "uvx".
  string distribution = 9;
}

message AgentEnv {
  string name = 1;
  // Empty for a secret one as listed; saved again empty, it keeps the
  // value it has.
  string value = 2;
  // Kept in the machine's credential store, not in agents.json. Names
  // that look like a key, token or password are secret whatever this says.
  bool secret = 3;
}

message ListCustomAgentsRequest {}

message ListCustomAgentsResponse {
  repeated CustomAgent agents = 1;
}

message SaveCustomAgentRequest {
  CustomAgent agent = 1;
}

message SaveCustomAgentResponse {}

message RemoveCustomAgentRequest {
  string name = 1;
}

message RemoveCustomAgentResponse {}

message TestCustomAgentRequest {
  // Its secret variables left empty take the values saved for the agent
  // of that name, if any.
  CustomAgent agent = 1;
}

message TestCustomAgentResponse {
  // It started, answered initialize and opened a session.
  bool ok = 1;
  // Why not, as far as known: what it printed, or the error it answered.
  string reason = 2;
  // What it says it is (initialize's agentInfo), when it says.
  string agent_title = 3;
  string agent_version = 4;
  uint32 millis = 5;
  // The sign-in methods it offers, when a session needs one first.
  repeated string auth_methods = 6;
  // Negotiated ACP protocol version (Aide speaks version 1 only).
  uint32 protocol_version = 7;
  // Truthful capabilities discovered from initialize.agentCapabilities.
  AgentCapabilities capabilities = 8;
  // Models announced during the handshake session, if any.
  repeated AgentModel models = 9;
}

// ACPRegistryEntry describes one installable agent from the official
// agentclientprotocol/registry catalog (Apache-2.0, 工单 #110).
message ACPRegistryEntry {
  string id = 1;
  string name = 2;
  string version = 3;
  string description = 4;
  string repository = 5;
  string license = 6;
  repeated string authors = 7;
  // Best distribution available for this machine's platform: "binary", "npx", "uvx", or "".
  string distribution = 8;
  // True when a binary archive has a SHA-256 digest verified during installation.
  bool sha256_verified = 9;
  // True when this machine's OS/arch can install this entry.
  bool supported = 10;
  // Why it cannot be installed here (e.g. unsupported platform or built-in dedicated provider).
  string unsupported_reason = 11;
  // True when already installed on this machine (via custom agent or built-in provider).
  bool installed = 12;
  // The machine agent name it is installed as (when installed == true).
  string installed_as = 13;
}

message ListACPRegistryRequest {
  // Force refresh from the official registry index instead of using the cache.
  bool refresh = 1;
}

message ListACPRegistryResponse {
  repeated ACPRegistryEntry entries = 1;
  // "remote", "cache", or "embedded".
  string source = 2;
  google.protobuf.Timestamp synced_at = 3;
  string last_error = 4;
  string platform = 5;
}

message InstallACPRegistryAgentRequest {
  // Official registry entry id (e.g. "opencode", "claude-agent-acp").
  string registry_id = 1;
  // Optional custom agent name on this machine; defaults to a normalized registry_id.
  string name = 2;
}

message InstallACPRegistryAgentResponse {
  CustomAgent agent = 1;
  string install_dir = 2;
  string sha256 = 3;
}

message ListDSHSessionsRequest {}

message ListDSHSessionsResponse {
  repeated DSHSession sessions = 1;
  // The Aide bridge plugin in DSH Desktop, through which a session
  // taken over is sent messages (unset for an agent's call).
  DSHBridge bridge = 2;
  // The DSH home the sessions are read from (unset for an agent's call):
  // where to look when DSH Desktop has sessions this list lacks.
  string dsh_home = 3;
}

// DSHBridge is the Aide bridge plugin as aided finds it.
message DSHBridge {
  DSHBridgeState state = 1;
  // The plugin's version, when it answers.
  string version = 2;
  // What is wrong, or what to do, for the person.
  string detail = 3;
  // The plugin's package Aide prepared in the DSH home (PrepareDSHBridge),
  // when one of the version this aided ships is there; empty: none yet.
  string package_path = 4;
  // The version this aided ships: a running plugin of an older one is out
  // of date.
  string latest_version = 5;
  // The last install handed to DSH (InstallDSHBridge), if any.
  DSHBridgeInstall install = 6;
}

// DSHBridgeInstall is how the last install handed to DSH went (工单 #59).
message DSHBridgeInstall {
  DSHBridgeInstallState state = 1;
  // The DSH session doing it, to open and read.
  string session_id = 2;
  // In words, for the person: why it failed, or what is left to do.
  string reason = 3;
  google.protobuf.Timestamp started_at = 4;
  // When DSH reported (`aided dsh-bridge report`); unset while it works.
  google.protobuf.Timestamp reported_at = 5;
}

enum DSHBridgeInstallState {
  DSH_BRIDGE_INSTALL_STATE_UNSPECIFIED = 0;
  // DSH is at it.
  DSH_BRIDGE_INSTALL_STATE_RUNNING = 1;
  // DSH reported it installed and the plugin answers.
  DSH_BRIDGE_INSTALL_STATE_DONE = 2;
  // DSH reported it installed, but the plugin does not answer yet: DSH
  // Desktop has not restarted since.
  DSH_BRIDGE_INSTALL_STATE_RESTART = 3;
  // DSH reported it could not install it (reason), or its session ended
  // without a report.
  DSH_BRIDGE_INSTALL_STATE_FAILED = 4;
}

enum DSHBridgeState {
  DSH_BRIDGE_STATE_UNSPECIFIED = 0;
  // It has never run in this DSH home: not installed, or DSH Desktop has
  // not started since.
  DSH_BRIDGE_STATE_NOT_INSTALLED = 1;
  // It ran but does not answer now: DSH Desktop is closed, or the plugin
  // was turned off.
  DSH_BRIDGE_STATE_NOT_RUNNING = 2;
  // It answers and can send.
  DSH_BRIDGE_STATE_RUNNING = 3;
  // It answers but cannot be used: another protocol version, or a DSH
  // profile without a session controller.
  DSH_BRIDGE_STATE_INCOMPATIBLE = 4;
}

message SetDSHTakeoverRequest {
  string session_id = 1;
  bool on = 2;
}

message SetDSHTakeoverResponse {
  DSHSession session = 1;
}

message SendDSHMessageRequest {
  string session_id = 1;
  // At most 100 KiB.
  string text = 2;
  // Names the message for DSH, which drops a second one with the same id
  // (a retry); it starts "aide-". Empty: a new one.
  string request_id = 3;
  // The model (and reasoning effort) the session goes on with, set in DSH
  // before the message, as DSH's own model picker does; unset: as it is.
  DSHModel model = 4;
  // The permission preset the session goes on with (DSH's /permission);
  // "": as it is.
  string permission = 5;
}

// DSHModel is a model as DSH names it: its provider, the model, and the
// reasoning effort ("" for the model's default).
message DSHModel {
  string provider = 1;
  string model = 2;
  string effort = 3;
}

message DSHSessionOptionsRequest {
  string session_id = 1;
}

message DSHSessionOptionsResponse {
  repeated DSHModelOption models = 1;
  repeated DSHPermissionOption permissions = 2;
  // What the session has now, as far as DSH tells (unset / "": not known).
  DSHModel current_model = 3;
  string current_permission = 4;
}

message DSHModelOption {
  string provider = 1;
  string provider_name = 2;
  string model = 3;
  string model_name = 4;
  repeated string efforts = 5;
}

message DSHPermissionOption {
  string id = 1;
  string name = 2;
  string description = 3;
}

message SendDSHMessageResponse {
  string request_id = 1;
}

message PrepareDSHBridgeRequest {}

message InstallDSHBridgeRequest {}

message InstallDSHBridgeResponse {
  // The DSH session installing it.
  string session_id = 1;
  // The package it installs.
  string package_path = 2;
}

message PrepareDSHBridgeResponse {
  // The plugin's package (an npm tarball) on the machine, to install from
  // in DSH Desktop › Plugins.
  string package_path = 1;
  string version = 2;
  // Where DSH's configuration was backed up, and the files (relative to
  // the DSH home).
  string backup_dir = 3;
  repeated string backed_up = 4;
  // DSH Desktop's profile is at <DSH home>/profiles/desktop (backed up
  // with the rest); false: it is elsewhere or not made yet (open DSH
  // Desktop once), and was not backed up.
  bool desktop_profile = 5;
}

message InterruptDSHSessionRequest {
  string session_id = 1;
}

message InterruptDSHSessionResponse {
  // False: no turn of it runs in DSH Desktop.
  bool interrupted = 1;
}

// DSHSession is a session of DeepSeek Harness, as its files on the machine
// tell it.
message DSHSession {
  // DSH's own id of the session.
  string session_id = 1;
  // Its title in DSH; else the first line of its first prompt.
  string title = 2;
  // The folder it works in ("" for none).
  string cwd = 3;
  DSHSessionState state = 4;
  google.protobuf.Timestamp created_at = 5;
  // When it last recorded something (its last event).
  google.protobuf.Timestamp last_activity_at = 6;
  // A turn has started and not ended: with RUNNING it is under way; with
  // ENDED, DSH stopped before it ended (DSH closes it when it opens the
  // session again).
  bool turn_open = 7;
  // Archived in DSH Desktop's sidebar.
  bool archived = 8;
  // The DSH Desktop agent preset it was made with, if any.
  string agent_preset = 9;
  // Why its conversation can't be read (e.g. "unsupported DSH log format
  // version 5"); title, state and last activity are then as far as known.
  string error = 10;
  // The owner took it over in Aide (SetDSHTakeover): Aide may send
  // it messages. Aide's own setting, kept on the machine.
  bool takeover = 11;
}

enum DSHSessionState {
  // Unknown: this system does not let Aide see whether a DSH process
  // has the session open (macOS).
  DSH_SESSION_STATE_UNSPECIFIED = 0;
  // A DSH process has it open and a turn is under way.
  DSH_SESSION_STATE_RUNNING = 1;
  // A DSH process has it open, waiting for a prompt.
  DSH_SESSION_STATE_IDLE = 2;
  // No DSH process has it open; DSH can go on with it.
  DSH_SESSION_STATE_ENDED = 3;
}

// ReadDSHSessionRequest pages through a DSH session's events by seq, as
// aide.session.v1.ListEventsRequest does.
message ReadDSHSessionRequest {
  string session_id = 1;
  uint64 after_seq = 2;
  uint64 before_seq = 3;
  // 1 to 1000; 0 means 50.
  uint32 limit = 4;
  aide.session.v1.EventView view = 5;
}

message ReadDSHSessionResponse {
  DSHSession session = 1;
  // Oldest first: turns started and completed, the owner's prompts, DSH's
  // replies, tool calls and their results (a result longer than 16 KiB is
  // cut there, truncated set; its whole is not kept apart, so
  // ReadToolOutput can't read it), and a StatusChanged with reason
  // "compacted" where DSH compacted the conversation.
  repeated aide.session.v1.SessionEvent events = 2;
  bool has_more_before = 3;
  bool has_more_after = 4;
}

message ListClaudeSessionsRequest {}

message ListClaudeSessionsResponse {
  repeated ClaudeSession sessions = 1;
  // The Claude desktop app's index folders read (claude-code-sessions):
  // where to look when the app has sessions this list lacks.
  repeated string indexes = 2;
}

// ClaudeSession is a Claude Code session as the Claude desktop app lists
// it (docs/claude-sessions.md).
message ClaudeSession {
  // The app's id of it ("local_…").
  string session_id = 1;
  // Claude Code's own id: its transcript's name.
  string cli_session_id = 2;
  // Its title in the app.
  string title = 3;
  // The folder it works in.
  string cwd = 4;
  // "owner/repo" of the GitHub repository the folder is a checkout of, as
  // its own origin remote says; "" when it has none (no checkout, no
  // origin, or not on GitHub). Never guessed from the conversation.
  string repo = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp last_activity_at = 7;
  // Archived in the app.
  bool archived = 8;
  string model = 9;
  // The app's last word on it, after its last turn ("completed",
  // "blocked", …); "" when it has none.
  string status = 10;
  // Why its conversation can't be read (no transcript here); "" when it
  // can.
  string error = 11;
  // Where a message to it goes: the address of its conversation under this
  // computer's CLI agent (c_…/<conversation key>), once that agent's hooks
  // reported the conversation here (`aide message hook claude`, its
  // SessionStart); "" before, when it takes no message
  // (docs/agent-messages.md §15.4). Never worked out from the app's data.
  string address = 12;
}

message ReadClaudeSessionRequest {
  string session_id = 1;
  uint64 after_seq = 2;
  uint64 before_seq = 3;
  // 1 to 1000; 0 means 50.
  uint32 limit = 4;
  aide.session.v1.EventView view = 5;
}

message ReadClaudeSessionResponse {
  ClaudeSession session = 1;
  // Oldest first: the owner's prompts, Claude's replies, tool calls and
  // their results (a result longer than 16 KiB is cut there).
  repeated aide.session.v1.SessionEvent events = 2;
  bool has_more_before = 3;
  bool has_more_after = 4;
}

message ListExecLogRequest {}

message ListExecLogResponse {
  // Newest first; the machine keeps the last 500.
  repeated ExecRecord records = 1;
}

message ListReposRequest {}

message ListReposResponse {
  repeated Repo repos = 1;
}

message Repo {
  // As the person writes it: "~/app".
  string path = 1;
  string branch = 2;
  google.protobuf.Timestamp last_commit = 3;
}

message ListFoldersRequest {
  // "~/code", or a full path; empty or "~" is the home folder.
  string path = 1;
  // Folders whose name starts with a dot too.
  bool hidden = 2;
}

message ListFoldersResponse {
  // The folder listed, as the person writes it: "~/code".
  string path = 1;
  repeated Folder folders = 2;
  // The files in it, counted, not listed.
  int32 files = 3;
  // Whether it is a git repository, its branch checked out, and its local
  // branches by name.
  bool repo = 4;
  string branch = 5;
  repeated string branches = 6;
  // Its full path, links resolved, as a project made of it records it.
  string full_path = 7;
}

message Folder {
  string name = 1;
  // As the person writes it: "~/code/app".
  string path = 2;
  // Whether it is a git repository, and its branch checked out.
  bool repo = 3;
  string branch = 4;
  // A folder macOS asks the person about before an app reads it (Desktop,
  // Documents…): opening it shows that question on the Mac.
  bool protected = 5;
}

message TestAgentRequest {
  string agent = 1;
}

message TestAgentResponse {
  bool ok = 1;
  // The coding agent's answer, or why it gave none.
  string reply = 2;
  uint32 millis = 3;
}

message ApplyAdminCommandRequest {
  // Signed AdminCommand.
  aide.identity.v1.Signed command = 1;
  // Or, for the machine's settings, the command itself: adding or removing
  // a project and pausing are configuration, not permissions (a grant is
  // full trust on its machines; projects tell agents what to use), so the
  // owner's trusted devices send them over their own connection without a
  // root signature. Renaming still needs a signed machine cert.
  aide.identity.v1.AdminCommand settings = 2;
}

message ApplyAdminCommandResponse {
  string message = 1;
}

message PushRevocationsRequest {
  aide.identity.v1.RevocationList revocations = 1;
  // A longer root chain, if any.
  aide.identity.v1.RootChain root_chain = 2;
}

message PushRevocationsResponse {
  bool applied = 1;
}

message ListHeldMessagesRequest {}

message ListHeldMessagesResponse {
  // Oldest first.
  repeated HeldMessage messages = 1;
}

message HeldMessage {
  string message_id = 1;
  // The sender's address (c_…, c_…/<name>) and name.
  string from = 2;
  string from_name = 3;
  // The session it is for (s_…, dsh_…).
  string session_id = 4;
  string text = 5;
  string subject = 6;
  // Why: "new_agent", "long_chain" or "boundary".
  string reason = 7;
  // In words; for "boundary", the rule's category (never what matched).
  string detail = 8;
  google.protobuf.Timestamp held_at = 9;
  // When it expires if not released.
  google.protobuf.Timestamp expires_at = 10;
  uint32 hop = 11;
}

message ReleaseHeldMessageRequest {
  string message_id = 1;
  // false: discard it.
  bool release = 2;
}

message ReleaseHeldMessageResponse {}

// Rooms (ROOMS-DESIGN-2026-11-22).

message Room {
  // "room_" and a ULID.
  string room_id = 1;
  string name = 2;
  // The machine that keeps and runs it.
  string host_machine_id = 3;
  repeated RoomMember members = 4;
  // The owner and one personal agent: the agent's conversation, shown on
  // its bot page rather than among the rooms.
  bool direct = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  RoomMode mode = 8;
  // A round table's limit: so many hand-ons after the owner speaks (1–20).
  uint32 max_rounds = 9;
  // Hand-ons since the owner last spoke.
  uint32 round = 10;
  RoomRun run = 11;
  // Messages since the owner last read the room (MarkRoomSeen).
  uint32 unread = 12;
  // The last message, in a line, for the roster.
  string last_line = 13;
  // The chain the room's messages go on now (the owner's word starts one).
  string trace_id = 14;
  string seen_message_id = 15;
  // What the owner signed for a room with coding agents (identity.v1
  // RoomCharter, signed by one of the owner's devices): which machines'
  // agents it may wake, in which projects. Machines check it before they
  // take a room's wake.
  aide.identity.v1.Signed charter = 16;
  aide.identity.v1.Signed charter_device_cert = 17;
  // What the host last told the owner of this room (工单 #69, #70): a
  // result handed in, the round limit reached, a member naming the owner, a
  // member woken and quiet for two minutes; and when. The owner's devices
  // notify with it, once each.
  string notice = 18;
  google.protobuf.Timestamp notice_at = 19;
  // Read-only shadow conversation aggregating 1:1 mailbox exchanges between
  // two personal agents (工单 #124).
  bool shadow = 20;
}

enum RoomMode {
  // Unset: as manual.
  ROOM_MODE_UNSPECIFIED = 0;
  // Only the bots the owner names (@) are woken.
  ROOM_MODE_MANUAL = 1;
  // Bots hand on to each other by naming one (@), up to the round limit.
  ROOM_MODE_ROUNDTABLE = 2;
  // Lightweight casual chat: tiny bounded context and direct replies without
  // heavy task scaffolding (工单 #123).
  ROOM_MODE_LIGHT = 3;
}

enum RoomRun {
  // Unset: nothing under way, waiting for the owner.
  ROOM_RUN_UNSPECIFIED = 0;
  // A bot was woken and the owner waits for it.
  ROOM_RUN_RUNNING = 1;
  // A round table stopped at its round limit.
  ROOM_RUN_STOPPED_LIMIT = 2;
  // The owner stopped it.
  ROOM_RUN_STOPPED_OWNER = 3;
}

message RoomMember {
  // The bot's key as the roster has it: "c:<client id>" for an agent with
  // an inbox, "m:<machine id>/<agent>" for a coding agent of the host's.
  string bot_key = 1;
  // Its inbox (c_…); "" for a coding agent.
  string address = 2;
  string name = 3;
  // A coding agent's: its machine, the project it works in there, and the
  // session it talks in (made the first time it is woken).
  string agent = 4;
  string project_id = 5;
  string session_id = 6;
  string machine_id = 7;
}

enum RoomDeliveryState {
  ROOM_DELIVERY_STATE_UNSPECIFIED = 0;
  // Sent: waiting at the post office for the member to take it.
  ROOM_DELIVERY_STATE_SENT = 1;
  // The member answered it.
  ROOM_DELIVERY_STATE_REPLIED = 2;
  // Not sent: the reason says why (the owner's information boundary for
  // this member's kind, the member unreachable…).
  ROOM_DELIVERY_STATE_REFUSED = 3;
  // Sending failed for now; the owner can send it again.
  ROOM_DELIVERY_STATE_FAILED = 4;
  // The member took it from the post office (工单 #71: "it took the
  // letter"), or its session here has it: not answered yet.
  ROOM_DELIVERY_STATE_TAKEN = 5;
  // Not sent yet: the host's limit of bots at work at once is reached
  // (工单 #70); it is woken as soon as one of them is done.
  ROOM_DELIVERY_STATE_QUEUED = 6;
}

message RoomDelivery {
  string bot_key = 1;
  RoomDeliveryState state = 2;
  // In words, when it was not sent.
  string reason = 3;
  // The id of the member's own copy (one message per recipient), which its
  // answer is in reply to.
  string copy_id = 4;
  // Woken and quiet for two minutes: the owner was told, once (工单 #70).
  bool reminded = 5;
}

message RoomMessage {
  string message_id = 1;
  string room_id = 2;
  // "owner", or the member's bot key.
  string from = 3;
  string from_name = 4;
  // Markdown.
  string text = 5;
  google.protobuf.Timestamp at = 6;
  // The owner's: what became of it for each member it went to.
  repeated RoomDelivery deliveries = 7;
  // A member's: the message it answers.
  string in_reply_to = 8;
  // The bots the owner named (@), by bot key: the ones woken.
  repeated string mentions = 9;
  // The round it was said in.
  uint32 round = 10;
  // A reply that starts with [FINAL]: the room's agreed result, sealed
  // (its text's SHA-256; nothing changes it).
  bool final = 11;
  string final_sha256 = 12;
  // Came after the owner stopped the room: kept, hands nothing on.
  bool late = 13;
  // In manual mode, the bots a member named (@): the owner may hand it on.
  repeated string asks = 14;
  // From the host itself ("from" is "system"): the round limit reached…
  bool system = 15;
  // Recipient name in a read-only shadow conversation (from_name -> to_name, 工单 #124).
  string to_name = 16;
  // Optional subject of an agent-to-agent mailbox message (工单 #124).
  string subject = 17;
  // Sent via lightweight chat mode (工单 #123).
  bool light_chat = 18;
}

message ListRoomsRequest {}

message ListRoomsResponse {
  repeated Room rooms = 1;
}

message OpenDirectRoomRequest {
  // The personal agent's client id (c_…).
  string client_id = 1;
}

message ListRoomMessagesRequest {
  string room_id = 1;
  // The newest this many, oldest first; 0: all.
  uint32 limit = 2;
}

message ListRoomMessagesResponse {
  Room room = 1;
  repeated RoomMessage messages = 2;
}

message PostRoomMessageRequest {
  string room_id = 1;
  string text = 2;
  string idempotency_key = 3;
  // The bots named (@), by bot key.
  repeated string mentions = 4;
  // Lightweight chat path: minimal bounded context, fast direct reply (工单 #123).
  bool light_chat = 5;
}

message CreateRoomMember {
  string bot_key = 1;
  // A coding agent's project, on its machine.
  string project_id = 2;
  // Its name as the roster shows it ("DSH · work-pc").
  string name = 3;
}

message CreateRoomRequest {
  string name = 1;
  repeated CreateRoomMember members = 2;
  RoomMode mode = 3;
  uint32 max_rounds = 4;
  // With coding agents: the charter the owner's device signed, and its
  // device certificate.
  aide.identity.v1.Signed charter = 5;
  aide.identity.v1.Signed charter_device_cert = 6;
}

message UpdateRoomRequest {
  string room_id = 1;
  // Unset: left as it is.
  optional string name = 2;
  optional RoomMode mode = 3;
  optional uint32 max_rounds = 4;
}

message StopRoomRequest {
  string room_id = 1;
}

message MarkRoomSeenRequest {
  string room_id = 1;
}

message DeleteRoomRequest {
  string room_id = 1;
}

message DeleteRoomResponse {}
