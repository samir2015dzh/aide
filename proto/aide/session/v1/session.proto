syntax = "proto3";

package aide.session.v1;

import "google/protobuf/timestamp.proto";
import "aide/identity/v1/identity.proto";
import "aide/options/v1/options.proto";

// SessionService runs coding-agent sessions on a machine.
service SessionService {
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc GetSession(GetSessionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // WatchSessions sends the sessions the caller can read as they change:
  // first an empty message once the watch is in place, then the sessions
  // started or changed since the last message, each as it is now (changes
  // that come close together are sent together).
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  rpc StreamEvents(StreamEventsRequest) returns (stream SessionEvent) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // ListEvents returns one page of a session's events, oldest first.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // DeliverMessage hands the session a message an agent wrote, signed by
  // that agent (docs/agent-messages.md §7): it joins its sender's own turn,
  // answers its sender's own question, or starts, or waits for, a turn of
  // its own. Any agent whose grant covers the session and that may read it
  // can deliver one.
  rpc DeliverMessage(DeliverMessageRequest) returns (DeliverMessageResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // InterruptSession stops the turn in progress; the session stays, idle,
  // and the next message goes on in the same agent conversation.
  rpc InterruptSession(InterruptSessionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // ArchiveSession makes an idle session read-only and frees its worktree
  // (its branch keeps the work). Sessions never end otherwise.
  rpc ArchiveSession(ArchiveSessionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // UnarchiveSession restores the worktree from the branch; the session is
  // idle again.
  rpc UnarchiveSession(UnarchiveSessionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // DeleteSession deletes a session for good: its record, events,
  // attachments and worktree. Its branch stays in the project, with every
  // turn's work, and its tokens stay in GetUsage. A turn in progress is
  // interrupted first. Only the owner's devices may delete.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // RenameSession changes the session's title. Only the owner's devices
  // may rename.
  rpc RenameSession(RenameSessionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  rpc GetDiff(GetDiffRequest) returns (GetDiffResponse) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // AnswerQuestion answers (or declines) a question the agent asked.
  rpc AnswerQuestion(AnswerQuestionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // ReadToolOutput streams a tool's whole output, as recorded (up to 1 MiB;
  // past that its first and last 512 KiB), in chunks of at most 64 KiB:
  // what a BASIC event's preview, or a FULL one's first 16 KiB, is part of.
  rpc ReadToolOutput(ReadToolOutputRequest) returns (stream ToolOutputChunk) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
  // PushSession pushes the session's branch, as its last finished turn
  // left it, to its repository's remote origin under the same name, with
  // the machine's own git credentials (never forced). Aide never pushes
  // otherwise: only the owner or the client that started the session asks.
  rpc PushSession(PushSessionRequest) returns (PushSessionResponse) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // RollbackSession puts an idle (or crashed) worktree session back to
  // where an earlier turn left it: its worktree and branch are reset to
  // that turn's snapshot commit, the later turns' conversation and changes
  // are discarded, and the next message starts a fresh agent conversation
  // that is told so. The discarded turns stay in the timeline, after them
  // a RolledBack event. In-place sessions have no snapshots and are
  // refused (FAILED_PRECONDITION), as is a session with a turn running.
  rpc RollbackSession(RollbackSessionRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // MarkSessionSeen records what the owner has seen of the session
  // (Session.seen), on its machine, so every device of the owner agrees.
  // Only the owner's devices may mark. It is not activity: updated_at
  // stays (lists keep their order); nothing is written when nothing new is
  // seen, nor of an archived session.
  rpc MarkSessionSeen(MarkSessionSeenRequest) returns (Session) {
    option (aide.options.v1.access) = ACCESS_WRITE;
  }
  // GetSessionInsights reviews a session from its stored events
  // (docs/session-insights.md): each turn's time, failures and retries,
  // stalls and interrupts, questions and how long they waited, tool calls,
  // changes and tokens, what the review finds, and a better prompt to
  // dispatch such work with. Worked out by rules, never by a model; made
  // when the session is archived or when asked, and kept until a new event
  // comes.
  rpc GetSessionInsights(GetSessionInsightsRequest) returns (SessionInsights) {
    option (aide.options.v1.access) = ACCESS_READ;
  }
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_QUEUED = 1;
  SESSION_STATUS_PREPARING = 2;
  SESSION_STATUS_RUNNING = 3;
  SESSION_STATUS_IDLE = 4;
  // Read-only: no messages until unarchived. The only way a session stops
  // being usable; it is never ended by time or by a failure.
  SESSION_STATUS_ARCHIVED = 5;
  reserved 6, 7;
  // The last turn did not finish (the agent crashed or could not start,
  // or aided restarted); the next message retries in the same session.
  SESSION_STATUS_CRASHED = 8;
  // The turn is paused until someone answers the agent's question (see
  // SessionProgress.pending_question).
  SESSION_STATUS_WAITING_INPUT = 9;
}

// SessionState is what a session is doing, as every screen and the CLI
// say it (docs/session-states.md §2). It is worked out from Session.status
// and progress by whoever shows it, never sent by machines; one table for
// all (internal/sessionstate, packages/core states.ts, Android States.kt,
// checked against the same cases in
// internal/sessionstate/testdata/cases.json).
enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  // Waiting for a slot, or its worktree being prepared.
  SESSION_STATE_QUEUED = 1;
  SESSION_STATE_RUNNING = 2;
  // Paused on the agent's question.
  SESSION_STATE_WAITING_INPUT = 3;
  // Paused on an approval (Her's cards; coding sessions ask none today).
  SESSION_STATE_WAITING_APPROVAL = 4;
  // Finished a turn the owner has not opened yet (Session.seen).
  SESSION_STATE_DONE_UNSEEN = 5;
  SESSION_STATE_DONE = 6;
  // The last turn failed, or did not finish (crashed).
  SESSION_STATE_FAILED = 7;
  // The last turn was stopped on purpose.
  SESSION_STATE_INTERRUPTED = 8;
  SESSION_STATE_ARCHIVED = 9;
}

// SessionLink is how fresh what is shown of a session is: the second of
// the two things every screen and the CLI show (docs/session-states.md §3).
enum SessionLink {
  SESSION_LINK_UNSPECIFIED = 0;
  // Its machine answers: what is shown is current.
  SESSION_LINK_LIVE = 1;
  // Live, running, but nothing new for at least the stall limit.
  SESSION_LINK_STALLED = 2;
  // Its machine stopped answering less than the lost limit ago: shown as
  // last known while that is checked.
  SESSION_LINK_CHECKING = 3;
  // Its machine has not been heard from for the lost limit or longer:
  // what is shown is last known, never "running".
  SESSION_LINK_LOST = 4;
  // Its machine is back and being read again: last known until then.
  SESSION_LINK_SYNCING = 5;
}

// FailureKind classifies why a turn or a session failed (see
// docs/reliability-plan.md).
enum FailureKind {
  FAILURE_KIND_UNSPECIFIED = 0;
  // Not logged in or credentials rejected; the owner must log in on the machine.
  FAILURE_KIND_AUTH = 1;
  // Usage or billing limit reached.
  FAILURE_KIND_QUOTA = 2;
  // Rate limited or provider over capacity; retry later.
  FAILURE_KIND_RATE_LIMIT = 3;
  // Provider server error (5xx); retry later.
  FAILURE_KIND_PROVIDER_ERROR = 4;
  // Connection to the provider failed or dropped; retry.
  FAILURE_KIND_NETWORK = 5;
  // The conversation no longer fits the model's context window.
  FAILURE_KIND_CONTEXT_OVERFLOW = 6;
  // The model does not exist or this account cannot use it.
  FAILURE_KIND_MODEL_UNAVAILABLE = 7;
  // The provider rejected the request (400).
  FAILURE_KIND_INVALID_REQUEST = 8;
  // The model or a policy refused the task.
  FAILURE_KIND_REFUSED = 9;
  // The turn hit the agent's step or token limit.
  FAILURE_KIND_LIMIT_REACHED = 10;
  // The provider session could not be resumed.
  FAILURE_KIND_RESUME_REJECTED = 11;
  // The agent process exited unexpectedly.
  FAILURE_KIND_AGENT_CRASHED = 12;
  // The agent made no progress for too long.
  FAILURE_KIND_STALLED = 13;
  // The turn exceeded the machine's turn time limit.
  FAILURE_KIND_TIMEOUT = 14;
  // The agent could not be started.
  FAILURE_KIND_START_FAILED = 15;
  FAILURE_KIND_UNKNOWN = 16;
  // Someone interrupted the turn on purpose (the session goes on).
  FAILURE_KIND_INTERRUPTED = 17;
  // The worktree's base ref does not resolve to a local commit.
  FAILURE_KIND_BASE_REF_UNAVAILABLE = 18;
}

message Failure {
  FailureKind kind = 1;
  // Redacted and truncated provider or daemon message.
  string message = 2;
  // Retrying the same request later may succeed.
  bool retryable = 3;
  uint32 retry_after_seconds = 4;
  // One-line advice for the caller.
  string hint = 5;
  uint32 http_status = 6;
}

message StartSessionRequest {
  string idempotency_key = 1;
  string project_id = 2;
  // "claude" | "codex" | an ACP agent ("gemini", "cursor", ...)
  string agent = 3;
  string prompt = 4;
  string base_ref = 5;
  string model = 6;
  reserved 7;
  reserved "preset";
  repeated Attachment attachments = 8;
  // How long the agent's questions wait for an answer; then the agent is
  // told to continue on its best judgment. Unset: 30 minutes; 0: nobody
  // answers (the agent is told so at once).
  optional uint32 question_timeout_seconds = 9;
  // A short title for session lists. Without one, the session is titled
  // by the first line of the prompt.
  string title = 10;
  // The starter's own conversation (a Claude Code session id, a Codex
  // thread): the session's news goes to it (docs/agent-messages.md §6.2).
  string conversation = 11;
  // Reasoning effort, one the model offers (AgentModel.efforts); unset:
  // the machine's default for the agent, else the agent's own.
  string effort = 12;
  // Instead of project_id: a GitHub repository, "owner/repo" or its URL,
  // that the machine need not have. The machine checks at once that its
  // own git credentials reach it (Aide keeps none) and fails otherwise,
  // then clones it into its data folder (or fetches the clone an earlier
  // session made), kept as a worktree project (Session.project_id), and
  // the session works there as in any worktree project. base_ref is the
  // branch to start from (default: the repository's default branch).
  string repo = 20;
  // Session mode (an ACP agent's permission or approval preset), one the
  // agent offers (AgentStatus.modes); unset: the machine's default for the
  // agent, else the agent's own.
  string mode = 13;
}

// Attachment is a file sent with a message (at most 20 files and 32 MiB
// per message). The machine saves it next to the session, outside the
// worktree, and lists its path in the message; PNG, JPEG, GIF and WebP
// images up to 3.5 MiB are also shown to the agent as images.
message Attachment {
  // File name; directories are dropped.
  string name = 1;
  // Detected from the name and content when empty.
  string media_type = 2;
  bytes data = 3;
}

// AttachmentInfo describes a saved attachment.
message AttachmentInfo {
  string name = 1;
  string media_type = 2;
  uint64 size = 3;
  // Where the machine saved it.
  string path = 4;
  string sha256 = 5;
  // Shown to the agent as an image (not only listed by path).
  bool image = 6;
}

message StartSessionResponse {
  Session session = 1;
}

// What a trusted device is told on its lock screen, sealed to its notice
// key end to end (identity.v1.PushRegistration): the relay forwards it
// without reading it.
message Notice {
  // "question", "failure", "turn_done" or "session_started"; "her" from
  // an aided from before Aide dropped Her.
  string kind = 1;
  google.protobuf.Timestamp at = 2;
  // A session's notice.
  string session_id = 3;
  string title = 4;
  // Who started the session: its grant's label.
  string grant = 5;
  // The coding agent.
  string agent = 6;
  string project = 7;
  string machine = 8;
  // kind "question": what the agent asks.
  Question question = 9;
  // kind "failure".
  FailureKind failure = 10;
  string failure_message = 11;
  // kind "turn_done": the turn and what it changed.
  uint32 turn = 12;
  DiffStat diff_stat = 13;
  reserved 14 to 17;
  reserved "pairing_kind", "pairing_label", "verification_code", "pairing_code";
  // Her's notices (kind "her"), from an aided from before Aide dropped her.
  reserved 18 to 22;
  reserved "her_kind", "machine_id", "bot_id", "bot_name", "text";
}

message DiffStat {
  uint32 files_changed = 1;
  uint32 insertions = 2;
  uint32 deletions = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  double cost_usd = 3;
}

message SessionProgress {
  uint32 turn_count = 1;
  string phase = 2;
  string last_message_excerpt = 3;
  string current_tool = 4;
  DiffStat diff_stat = 5;
  Usage usage = 6;
  uint64 last_event_seq = 7;
  // The most recent turn or session failure; cleared by a successful turn.
  Failure last_failure = 8;
  // The question the agent waits on (status WAITING_INPUT).
  Question pending_question = 9;
  // When the turn in progress started (waiting for an answer included);
  // unset once the turn is over.
  google.protobuf.Timestamp turn_started_at = 10;
  // When the event last_event_seq was recorded (the machine's clock): how
  // long a running session has been quiet (docs/session-states.md §3).
  // Unset from older machines; updated_at stands in.
  google.protobuf.Timestamp last_event_at = 11;
}

// Question is a question the agent asks mid-turn (Claude Code's
// AskUserQuestion, Codex's questions, ACP elicitation).
message Question {
  string question_id = 1;
  uint32 turn = 2;
  repeated QuestionItem items = 3;
  google.protobuf.Timestamp asked_at = 4;
  // When the agent is told to continue without an answer.
  google.protobuf.Timestamp expires_at = 5;
}

// QuestionItem is one question of a Question; answer each by its id.
message QuestionItem {
  string id = 1;
  // Short label (e.g. "Color").
  string header = 2;
  string text = 3;
  repeated QuestionOption options = 4;
  // Several options may be chosen.
  bool multi_select = 5;
  // A free-text answer is accepted (always, when there are no options).
  bool allow_other = 6;
  // The answer is a secret: it goes to the agent but is not recorded.
  bool secret = 7;
  // The agent can go on without an answer to this item (an optional form field).
  bool optional = 8;
}

message QuestionOption {
  string label = 1;
  string description = 2;
}

message Answer {
  string item_id = 1;
  // Labels of the chosen options.
  repeated string selected = 2;
  // A free-text answer (with or instead of options).
  string text = 3;
}

enum QuestionResolution {
  QUESTION_RESOLUTION_UNSPECIFIED = 0;
  QUESTION_RESOLUTION_ANSWERED = 1;
  // Declined by whoever answers: the agent is told no answer is coming.
  QUESTION_RESOLUTION_DECLINED = 2;
  // Nobody answered in time: the agent is told to continue on its own.
  QUESTION_RESOLUTION_TIMED_OUT = 3;
  // The turn ended or was stopped before an answer.
  QUESTION_RESOLUTION_CANCELLED = 4;
}

message QuestionAsked {
  Question question = 1;
}

message QuestionResolved {
  string question_id = 1;
  QuestionResolution resolution = 2;
  // Who answered: a client id, or "owner".
  string by = 3;
  // Secret answers read "[secret]".
  repeated Answer answers = 4;
}

message Session {
  string session_id = 1;
  string machine_id = 2;
  string project_id = 3;
  string agent = 4;
  reserved 5;
  reserved "preset";
  SessionStatus status = 6;
  string created_by = 7;
  SessionProgress progress = 8;
  string provider_session_ref = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  string error = 12;
  // Worktree sessions only.
  string branch = 13;
  aide.identity.v1.Workspace workspace = 14;
  // The agent's full reply in the last turn that finished (when that turn
  // failed, progress.last_failure says why). A caller that did not wait
  // reads it here once the session is idle again.
  string result = 15;
  // A short title for lists: the one the client gave, or the first line of
  // the prompt. Empty for sessions started by an older machine.
  string title = 16;
  // The name under created_by that started it (an agent's bot, or its own
  // conversation), "" for the agent itself.
  string created_as = 17;
  // The model it runs on: the one the agent reported when it started
  // (Claude Code and Codex), else the one Aide passed it; "" until
  // known.
  string model = 18;
  // The reasoning effort Aide passed, else the agent's own as it
  // reported it (Codex); "": the agent's own setting, which it does not
  // report (Claude Code).
  string effort = 19;
  // A session started in a GitHub repository (StartSessionRequest.repo):
  // the repository, "owner/repo", and the branch its worktree started from.
  string repo = 25;
  string repo_branch = 26;
  // What the owner has seen of it (MarkSessionSeen); unset from older
  // machines, where every turn counts as seen.
  SessionSeen seen = 27;
}

// SessionSeen is what the owner's devices have seen of a session, kept by
// its machine (docs/session-states.md §2 and §7).
message SessionSeen {
  // The finished turns the owner has opened: progress.turn_count when a
  // device last showed the session's page. An idle session whose last turn
  // succeeded, with more finished turns than this, is done_unseen.
  uint32 turns = 1;
  // The pending question a desktop told the owner of, and whether the
  // owner was at a desktop while it waited (or opened the session): a
  // phone holds back a question a desktop told of, and stays silent once
  // the owner was there.
  string question_id = 2;
  bool question_present = 3;
}

message GetSessionRequest {
  string session_id = 1;
}

message ListSessionsRequest {
  SessionStatus status = 1;
  google.protobuf.Timestamp since = 2;
  // Paging: at most limit sessions, newest first by (updated_at,
  // session_id), from the newest or from just past the session `before`
  // names. 0: every session, unpaged and in no set order.
  //
  // The first page (limit without before) also carries every unsettled
  // session however old, so lists can show those in full: queued,
  // preparing, running, waiting for an answer or crashed, or whose last
  // turn failed (not interrupted). A session that changes moves to the
  // start (updated_at only grows), where WatchSessions reports it, so the
  // pages after it never miss one.
  uint32 limit = 3;
  SessionCursor before = 4;
  SessionView view = 5;
}

// How much of a session a call returns (AIP-157).
enum SessionView {
  // FULL: what callers that predate views get.
  SESSION_VIEW_UNSPECIFIED = 0;
  // What lists show: all but result, progress.last_message_excerpt and
  // provider_session_ref.
  SESSION_VIEW_BASIC = 1;
  SESSION_VIEW_FULL = 2;
}

// How much of each event a call returns.
enum EventView {
  // FULL: what callers that predate views get.
  EVENT_VIEW_UNSPECIFIED = 0;
  // A tool result longer than 3 lines or 512 bytes comes as its first 3
  // lines, at most 512 bytes (cut at a UTF-8 boundary), with preview set;
  // ReadToolOutput reads it whole.
  EVENT_VIEW_BASIC = 1;
  // A tool result's first 16 KiB, with its size when it is longer.
  EVENT_VIEW_FULL = 2;
}

// SessionCursor is where a page of sessions ends: its last session's
// updated_at and id.
message SessionCursor {
  google.protobuf.Timestamp updated_at = 1;
  string session_id = 2;
}

message ListSessionsResponse {
  repeated Session sessions = 1;
  // Paging: where the next page starts; unset on the last page.
  SessionCursor next = 2;
}

message WatchSessionsRequest {
  SessionView view = 1;
}

message WatchSessionsResponse {
  repeated Session sessions = 1;
  // Sessions deleted since the last message.
  repeated string deleted_session_ids = 2;
}

message StreamEventsRequest {
  string session_id = 1;
  uint64 after_seq = 2;
  // When false, the stream ends after replaying stored events.
  bool follow = 3;
  EventView view = 4;
  // Also send AgentDraft events while the agent writes (docs/reply-streaming.md).
  bool partial = 5;
}

// ListEventsRequest pages through a session's events by seq: the latest
// `limit` events, the `limit` right after after_seq, or the `limit` right
// before before_seq (at most one of the two).
message ListEventsRequest {
  string session_id = 1;
  uint64 after_seq = 2;
  uint64 before_seq = 3;
  // 1 to 1000; 0 means 50.
  uint32 limit = 4;
  EventView view = 5;
}

message ListEventsResponse {
  // Oldest first.
  repeated SessionEvent events = 1;
  bool has_more_before = 2;
  bool has_more_after = 3;
}

message SessionEvent {
  uint64 seq = 1;
  google.protobuf.Timestamp ts = 2;
  string turn_id = 3;
  oneof kind {
    StatusChanged status = 10;
    TurnStarted turn_started = 11;
    UserMessage user_message = 12;
    AgentMessage agent_message = 13;
    ToolCall tool_call = 14;
    ToolResult tool_result = 15;
    TurnCompleted turn_completed = 16;
    ErrorEvent error = 17;
    QuestionAsked question_asked = 18;
    QuestionResolved question_resolved = 19;
    // Reply text the agent is still writing. Never stored, and seq is 0:
    // it is not a position to resume from. Sent only to streams that ask
    // (StreamEventsRequest.partial). Any stored event that follows ends the
    // draft; its text is then in that event, or the agent dropped it.
    AgentDraft agent_draft = 20;
    MessageReceived message_received = 21;
    MessageSent message_sent = 22;
    RolledBack rolled_back = 23;
    WorkspaceRequest workspace_request = 24;
  }
}

// The session was rolled back to the end of turn `turn` (0: its base):
// turns turn+1 to last_turn, the events before this one, are discarded,
// and the next turn is turn+1 again.
message RolledBack {
  uint32 turn = 1;
  uint32 last_turn = 2;
  // The worktree and branch are now at commit; discarded_commit is where
  // the branch was (still in the repository's reflog).
  string commit = 3;
  string discarded_commit = 4;
  // Who rolled it back (a client id, or "owner").
  string by = 5;
}

message StatusChanged {
  SessionStatus status = 1;
  string reason = 2;
}

message TurnStarted {
  uint32 turn = 1;
  // Who asked for the turn: the client id of the agent whose session start
  // or message began it (docs/agent-messages.md §7.2).
  string asker = 2;
}

// A message an agent wrote to the session (docs/agent-messages.md §7.2).
message MessageReceived {
  string message_id = 1;
  // The sender's address: a client id, or a machine id and session.
  string from = 2;
  string from_name = 3;
  string text = 4;
  string in_reply_to = 5;
  // What became of it: "turn" (it began a turn), "joined" (it joined its
  // sender's turn), "answer" (it answered its sender's question) or
  // "queued" (it waits for a turn of its own).
  string delivered = 6;
  repeated AttachmentInfo attachments = 7;
}

// A message the session's coding agent wrote to an agent.
message MessageSent {
  string message_id = 1;
  // The recipient's address.
  string to = 2;
  string to_name = 3;
  string text = 4;
  string in_reply_to = 5;
}

// A request the session's coding agent made, in a managed workspace, to
// the workspace's coordinator for a tool, a permission, a piece of
// information or a system change, or a change to one
// (docs/workspace-requests.md). Each event is the request as it stands
// after the change. Requests and replies travel as messages (an
// inbox.v1.Message carries one); the machine changes a request's status
// only on a reply signed by the coordinator or provisioner the request
// was made to, never on anything written in a file or a message's text.
message WorkspaceRequest {
  // "wr_" and a ULID, chosen by the machine.
  string request_id = 1;
  // "tool", "permission", "info" or "system_change".
  string kind = 2;
  // "pending", "approved", "rejected", "provisioned" (only the coordinator
  // or provisioner sets it) or "confirmed" (only the coding agent sets it,
  // once provisioned).
  string status = 3;
  // Who made this change, as UserMessage.from: "agent" (the session's
  // coding agent) or a client id; from_name is the name to show.
  string from = 4;
  string from_name = 5;
  // What was asked: the tool, permission, information or change.
  string item = 6;
  // A tool's version, where it comes from (its official source) and the
  // repository it is for.
  string version = 7;
  string source = 8;
  string repo = 9;
  // Why it is needed.
  string purpose = 10;
  // A permission's scope (and whether it is given back), a change's way
  // back.
  string scope = 11;
  string rollback = 12;
  // The reply's words: why it was rejected, the (redacted) information,
  // where a provisioned tool is and which version.
  string note = 13;
  // The coordinator the request went to, and the provisioner who may also
  // say it is provisioned: client ids, as the workspace named them when
  // the request was made.
  string coordinator = 14;
  string provisioner = 15;
  // The message that carried this change.
  string message_id = 16;
}

message UserMessage {
  // As the agent got it (with the list of attached files).
  string text = 1;
  repeated AttachmentInfo attachments = 2;
  // Who wrote it, when the session knows: "owner" (the owner, from any of
  // their devices) or an agent's client id; from_name is the name to show
  // ("" for the owner). Empty from: not known (an older session, or a DSH
  // session's prompt typed in DSH itself), read as the turn's asker.
  string from = 3;
  string from_name = 4;
}

message AgentMessage {
  string text = 1;
}

message AgentDraft {
  // Text to append to the draft.
  string text = 1;
  // Text is the whole draft so far, not an addition: the first draft a
  // stream sends, and the first after a stored event the reply went on past.
  bool whole = 2;
}

message ToolCall {
  string call_id = 1;
  // read | search | edit | shell | network | mcp | other
  string kind = 2;
  string name = 3;
  string summary = 4;
  // allow | deny
  string decision = 5;
  string reason = 6;
  // The line the call shows by, when summary is its raw arguments (a session
  // read from DSH's or Claude Desktop's records): the call's description, or
  // a natural summary (an edit's file and lines, the command's first line).
  // Empty: summary reads as it is.
  string title = 7;
}

message ToolResult {
  string call_id = 1;
  // The output: whole, or its first part when size is set.
  string summary = 2;
  bool is_error = 3;
  // summary is not the whole output: its first 16 KiB (FULL), or an
  // output cut when recorded (past 1 MiB its first and last 512 KiB are
  // kept; machines from before that kept its first 16 KiB only).
  bool truncated = 4;
  // summary is a preview (EVENT_VIEW_BASIC).
  bool preview = 5;
  // The whole output's length in bytes, when it is longer than summary:
  // ReadToolOutput reads it.
  uint64 size = 6;
}

message ReadToolOutputRequest {
  string session_id = 1;
  string call_id = 2;
}

message ToolOutputChunk {
  bytes data = 1;
  // On the first chunk: the whole length.
  uint64 size = 2;
}

message TurnCompleted {
  uint32 turn = 1;
  string result = 2;
  bool is_error = 3;
  Usage usage = 4;
  DiffStat diff_stat = 5;
  string commit = 6;
  // Set when is_error is true.
  Failure failure = 7;
}

message ErrorEvent {
  string message = 1;
  Failure failure = 2;
}

// SendMessage starts a turn on an idle session. While a turn runs, the
// message joins it when the agent takes input mid-turn (Claude Code,
// Codex), or becomes the next turn, started right after with no idle in
// between (ACP agents). A turn that fails drops the messages that waited
// for it.
message SendMessageRequest {
  string session_id = 1;
  string text = 2;
  repeated Attachment attachments = 3;
}

message SendMessageResponse {
  Session session = 1;
}

message DeliverMessageRequest {
  string session_id = 1;
  // An inbox.v1.Message, signed by the sender's identity key.
  aide.identity.v1.Signed message = 2;
  repeated Attachment attachments = 3;
}

message DeliverMessageResponse {
  Session session = 1;
  // As MessageReceived.delivered.
  string delivered = 2;
}

message InterruptSessionRequest {
  string session_id = 1;
}

message ArchiveSessionRequest {
  string session_id = 1;
}

message UnarchiveSessionRequest {
  string session_id = 1;
}

message DeleteSessionRequest {
  string session_id = 1;
}

message DeleteSessionResponse {}

message RenameSessionRequest {
  string session_id = 1;
  // The new title; it can't be empty.
  string title = 2;
}

message AnswerQuestionRequest {
  string session_id = 1;
  // Empty: the pending question.
  string question_id = 2;
  repeated Answer answers = 3;
  // No answer: the agent is told nobody will answer and to continue.
  bool decline = 4;
}

message GetDiffRequest {
  string session_id = 1;
  // 0 = cumulative since the base commit.
  uint32 turn = 2;
  bool stat_only = 3;
  uint64 offset = 4;
}

message GetDiffResponse {
  string diff = 1;
  DiffStat stat = 2;
  bool truncated = 3;
  uint64 next_offset = 4;
  string base_commit = 5;
  string head_commit = 6;
}

message PushSessionRequest {
  string session_id = 1;
}

message RollbackSessionRequest {
  string session_id = 1;
  // The turn to keep, and everything before it; 0 rolls every turn back.
  uint32 turn = 2;
}

message MarkSessionSeenRequest {
  string session_id = 1;
  // The owner opened the session's page: its finished turns are seen, and
  // its pending question too, the owner being there.
  bool opened = 2;
  // The pending question the caller told the owner of (a desktop's
  // notification); ignored unless it is the pending one.
  string question_id = 3;
  // The owner was at the caller while question_id waited.
  bool present = 4;
}

message PushSessionResponse {
  // The branch pushed, as the remote names it.
  string branch = 1;
  // Where to open a pull request of it, when the remote is on GitHub.
  string pull_request_url = 2;
}

message GetSessionInsightsRequest {
  string session_id = 1;
}

// SessionInsights is a session's review (GetSessionInsights). Times are
// the machine's clock; a turn still running counts up to its last event.
message SessionInsights {
  string session_id = 1;
  // The review is of the events up to this one.
  uint64 last_event_seq = 2;
  google.protobuf.Timestamp generated_at = 3;
  repeated TurnInsight turns = 4;
  // The turns' time, and the part of it spent waiting for answers.
  uint64 busy_ms = 5;
  uint64 question_wait_ms = 6;
  uint32 failed_turns = 7;
  // Failures by kind: the turns that failed (stalled and interrupted ones
  // too), the failures the machine retried a turn after, and the agent
  // starts that failed.
  repeated FailureCount failures = 8;
  // Times the machine went on with a turn by itself (after a rate limit,
  // or in a fresh agent session).
  uint32 auto_retries = 9;
  // Turns that started after a failed one: the work asked for again.
  uint32 retried_turns = 10;
  uint32 stalls = 11;
  uint32 interrupts = 12;
  repeated QuestionInsight questions = 13;
  // Tool calls by kind (ToolCall.kind), most first.
  repeated ToolCount tools = 14;
  // The session's changes, cumulative.
  DiffStat diff_stat = 15;
  Usage usage = 16;
  repeated InsightFinding findings = 17;
  // A better prompt to dispatch such work with: the first prompt, with
  // what later messages and answers added, and what the findings say it
  // lacked.
  string suggested_prompt = 18;
  // The whole review in Markdown, for a delivery record.
  string markdown = 19;
  // Times the session was rolled back (RollbackSession), and the turns
  // that discarded.
  uint32 rollbacks = 20;
  uint32 discarded_turns = 21;
}

message TurnInsight {
  uint32 turn = 1;
  google.protobuf.Timestamp started_at = 2;
  // Unset while the turn runs.
  google.protobuf.Timestamp ended_at = 3;
  uint64 duration_ms = 4;
  uint64 question_wait_ms = 5;
  uint32 tool_calls = 6;
  // Tool calls whose result was an error.
  uint32 tool_errors = 7;
  uint32 auto_retries = 8;
  // Why the turn failed; unspecified when it succeeded or runs.
  FailureKind failure = 9;
  DiffStat diff_stat = 10;
  Usage usage = 11;
  // A rollback discarded the turn; its number may come again.
  bool rolled_back = 12;
}

message FailureCount {
  FailureKind kind = 1;
  uint32 count = 2;
}

message QuestionInsight {
  string question_id = 1;
  uint32 turn = 2;
  google.protobuf.Timestamp asked_at = 3;
  // Unspecified while it waits.
  QuestionResolution resolution = 4;
  // From asked to resolved; 0 while it waits.
  uint64 wait_ms = 5;
  // Its questions' texts.
  repeated string texts = 6;
}

message ToolCount {
  string kind = 1;
  uint32 calls = 2;
  uint32 errors = 3;
}

// InsightFinding is something the review found that a better prompt
// would avoid.
message InsightFinding {
  // "clarifying_questions", "follow_ups", "repeated_failures", "stalled",
  // "interrupted", "rolled_back" or "missing_context".
  string code = 1;
  string text = 2;
}
