syntax = "proto3";

package aide.identity.v1;

import "google/protobuf/timestamp.proto";

// Signed wraps a serialized message together with a signature over
// "aide-sig-v1\0" || type || "\0" || body. Verifiers check the signature
// before parsing body.
message Signed {
  string type = 1;
  bytes body = 2;
  string signer_key_id = 3;
  SignatureAlgorithm alg = 4;
  bytes signature = 5;
}

enum SignatureAlgorithm {
  SIGNATURE_ALGORITHM_UNSPECIFIED = 0;
  // ECDSA over P-256 with SHA-256, ASN.1 DER signature.
  SIGNATURE_ALGORITHM_ECDSA_P256_SHA256 = 1;
}

// RootKey is a key that signs everything adding permissions
// (docs/accounts.md): the server's own key, which signs for whoever logs in
// with the account and password, and, for an owner set up before accounts,
// the root keys its devices had then.
message RootKey {
  // PKIX SubjectPublicKeyInfo, DER.
  bytes public_key = 1;
  // Its name, e.g. "服务器" or "Yi's MacBook Pro".
  string label = 2;
  // "server" for the server's key; for a device's, "windows", "android"...
  string platform = 3;
}

// RootCert lists the owner's root keys. Version 1 lists one key and is
// signed by it, and owner_id = "o_" + fingerprint(that key)[:24]. Every
// later version is signed by a key of the version before it.
message RootCert {
  string owner_id = 1;
  reserved 2;
  reserved "recovery_public_key";
  repeated RootKey root_keys = 3;
  uint64 version = 4;
  google.protobuf.Timestamp issued_at = 5;
}

// RootChain is every RootCert of an owner, version 1 first. Verifiers keep
// it and accept a longer one only if theirs is its prefix.
message RootChain {
  repeated Signed certs = 1;
}

// OwnerDeviceCert is signed by a root key (the server's, when the device
// logged in), for the device's own device key: what the owner's devices
// connect, read, drive and manage with.
message OwnerDeviceCert {
  string owner_id = 1;
  bytes device_public_key = 2;
  string label = 3;
  google.protobuf.Timestamp issued_at = 4;
}

// A trusted device (an iPhone, or an Android phone with Mi Push) asks to be
// notified while its app is not running: where (an APNs token, or a Mi
// Push regId) and how to seal notices so only it can read them. Signed by the device's own device key, which its
// OwnerDeviceCert certifies, so the relay can neither redirect notices to
// another key nor read them; it learns only the token.
message PushRegistration {
  string owner_id = 1;
  // SPKI DER of the device key that signs this.
  bytes device_public_key = 2;
  // The APNs device token, hex.
  string token = 3;
  // The APNs environment the app was built for: "production" or "development".
  string environment = 4;
  // An X25519 public key (32 bytes). Notices are HPKE-sealed to it:
  // DHKEM(X25519, HKDF-SHA256), HKDF-SHA256, AES-128-GCM, info
  // "aide-notice-v1".
  bytes notice_public_key = 5;
  // What it wants to hear about besides requests to connect, which always
  // come: "question", "failure", "turn_done".
  repeated string kinds = 6;
  google.protobuf.Timestamp issued_at = 7;
  // The push service the token is for: "" for APNs, "mipush" for Xiaomi's
  // Mi Push (the token is the app's regId; environment is "production").
  string service = 8;
}

// MachineCert is signed by a root key. It is the machine's identity, its
// key; the machine's name is a setting (SetName), not part of it.
message MachineCert {
  string owner_id = 1;
  string machine_id = 2;
  bytes machine_public_key = 3;
  reserved 4;
  reserved "machine_name";
  google.protobuf.Timestamp issued_at = 5;
  // A device's own machine: that device's id (the key id of its device key,
  // or of its root key for a device set up before accounts). Removing the
  // device removes this machine too.
  string device_key_id = 6;
}

// Workspace is how a project's sessions use its directory.
enum Workspace {
  // When adding a project: WORKTREE for a git repository, IN_PLACE for
  // any other directory.
  WORKSPACE_UNSPECIFIED = 0;
  // Each session works in its own git worktree and branch
  // aide/<session>, snapshotted once per turn; the directory itself is
  // never touched.
  WORKSPACE_WORKTREE = 1;
  // Sessions work directly in the directory, as when you run the agent
  // there yourself; Aide makes no worktree, branch or commit.
  WORKSPACE_IN_PLACE = 2;
}

enum TaskVisibility {
  TASK_VISIBILITY_UNSPECIFIED = 0;
  TASK_VISIBILITY_OWN = 1;
  TASK_VISIBILITY_ALL = 2;
}

// Grant is signed by a root key. For a given grant_id, machines only accept
// the highest version they have seen (and never below min_grant_versions).
message Grant {
  string owner_id = 1;
  string grant_id = 2;
  uint64 version = 3;
  string client_id = 4;
  bytes client_public_key = 5;
  string client_label = 6;
  // "*" means all.
  repeated string machine_ids = 7;
  repeated string project_ids = 8;
  repeated string agents = 9;
  // Was a permission preset; a grant now fully trusts its client.
  reserved 10;
  reserved "preset";
  TaskVisibility task_visibility = 11;
  uint32 max_concurrent_sessions = 12;
  google.protobuf.Timestamp not_before = 13;
  google.protobuf.Timestamp expires_at = 14;
  // The server that holds the client key (an MCP connection), "" for a
  // client that holds its own key.
  string custodian = 15;
  // The icon the owner picked for it: "" its seed's character (the
  // default), "bot:<shape>:<colour>" its character in that look (工单 #83);
  // from before, "letter" its initial, "app:<id>" an app's logo, "image"
  // client_image (drawn as its seed's character now).
  string client_icon = 16;
  // A square PNG or JPEG of at most 256 px, re-encoded by the owner's
  // device, when client_icon is "image".
  bytes client_image = 17;
  // Set on Her's own grant: the machine she runs
  // on, whose aided holds the client key. Turning Her off there or
  // removing that machine revokes it. "" for every other agent.
  string her_machine_id = 18;
  // Lets the client run one-shot commands on its machines
  // (MachineOpsService.Exec, docs/machine-ops.md). A scope of its own, off
  // unless the owner turns it on for this client: sessions don't need it.
  bool machine_exec = 19;
  // When the owner first let this client in (version 1 of the grant); later
  // versions keep it. Unset on a grant from before it was kept: such an
  // agent is not new. Machines hold a new agent's messages to sessions for
  // the owner (docs/agent-messages.md §15.5).
  google.protobuf.Timestamp first_issued_at = 20;
  // The kind of agent the owner set it to be (工单 #52): "personal" (it
  // follows the account) or "local" (a coding agent on a machine); "": as
  // its name tells. A label, like the icon: it grants nothing.
  string client_category = 21;
  // With "local": the machine it runs on ("" when not said).
  string client_category_machine_id = 22;
}

// EraseOrder is the owner's order to erase Aide everywhere
// (docs/erase-everything.md), signed by a root key on one trusted device.
// Each device, machine and agent of the owner that sees it, and verifies it
// against the root chain it holds, erases what Aide keeps there.
message EraseOrder {
  string owner_id = 1;
  // Random: names this erase, for the acks.
  string erase_id = 2;
  google.protobuf.Timestamp issued_at = 3;
  // The device that erased everything, by its name (the server signs the
  // order for it).
  string by = 4;
}

// EraseAck says that the key in it got an erase order and is erasing:
// signed by that key, before it is deleted.
message EraseAck {
  string erase_id = 1;
  // SPKI DER.
  bytes public_key = 2;
  // The id the owner knows it by: a trusted device's root key id (it acks
  // with its device key), a machine id, a client id. For showing who
  // acked; the relay is not trusted with more.
  string subject = 3;
  // A trusted device's device cert: it ties public_key to the root key
  // that signed it, the subject.
  Signed device_cert = 4;
}

// AdminCommand is signed by a root key and executed by the target machine.
message AdminCommand {
  string owner_id = 1;
  string command_id = 2;
  string target_machine_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  oneof command {
    AddProject add_project = 10;
    RemoveProject remove_project = 11;
    SetPaused set_paused = 13;
    SetName set_name = 14;
    AgentDefaults set_agent_defaults = 15;
    SetHer set_her = 16;
    SetWorkspaceRoots set_workspace_roots = 19;
    SetAgentHidden set_agent_hidden = 20;
    SetAgentPaused set_agent_paused = 21;
    SetProjectName set_project_name = 22;
  }
  reserved 12, 17, 18;
  reserved "rename_machine", "set_her_assistant_mode", "set_her_command_connector";
}

message AddProject {
  string project_id = 1;
  string path = 2;
  string default_base_ref = 3;
  Workspace workspace = 4;
  // What the project is, in the owner's words, for agents choosing where to
  // work (at most 200 characters). Adding the project again changes it.
  string description = 5;
  // The coding agents that may work in it (e.g. "claude"); empty: all.
  repeated string agents = 6;
}

message RemoveProject {
  string project_id = 1;
}

// SetAgentHidden hides a coding agent the machine lists, or shows it again:
// the owner's say over a listing they don't trust (an agent uninstalled that
// something left behind still answers for). A setting: it hides the entry,
// grants and takes away nothing. The machine's checks go on; a hidden agent
// shows again only when the owner rescans (CheckAgents rescan_hidden) and it
// then runs where it did not when hidden, or is found elsewhere.
message SetAgentHidden {
  // "claude" | "codex" | an ACP agent ("copilot", "deepseek", ...)
  string agent = 1;
  bool hidden = 2;
}

// SetAgentPaused pauses a coding agent on the machine, or resumes it: a
// setting, as hiding one is. While paused, no new session starts with it
// there (a plan's usage used up, say); its sessions under way run on, and
// nothing of it is removed.
message SetAgentPaused {
  // "claude" | "codex" | an ACP agent ("copilot", "deepseek", ...)
  string agent = 1;
  bool paused = 2;
  // With paused: when it resumes by itself (a plan's usage reset), else
  // only the owner resumes it. In the future.
  google.protobuf.Timestamp resume_at = 3;
}

// SetProjectName gives a project the name the owner's screens show it by,
// in place of its id (a folder's name such as "project", which the owner
// did not choose and the id cannot change): a setting, as hiding an agent
// is. Its id, folder and sessions stay as they are.
message SetProjectName {
  string project_id = 1;
  // At most 64 characters; empty: shown by its id again.
  string name = 2;
}

// SetWorkspaceRoots sets the folders the machine's owner devices may browse,
// make projects of and run commands in (docs/machine-ops.md §5); empty:
// anywhere, as before there were roots. Root-signed, or from the machine's
// own user: never a setting, as it fences what settings reach.
message SetWorkspaceRoots {
  // Full paths, or "~/…".
  repeated string roots = 1;
}

// The machine's name, as people and agents call it (agents address
// projects as name/project). A setting: it grants nothing.
message SetName {
  string name = 1;
}

message SetPaused {
  bool paused = 1;
}

// SetHer turns Her on or off for the machine: on, its
// aided keeps her running; off, it stops her and keeps her data, unless
// erase (§5.6). Root-signed only, never a setting.
message SetHer {
  bool enabled = 1;
  // With enabled false only: her data is deleted too, her home and, on a
  // Mac, her Keychain items. Refused with enabled true.
  bool erase = 2;
}

// AgentDefaults is what a coding agent's sessions on the machine run with
// when the client starting one names no model: a setting, it grants
// nothing. Empty fields follow the agent's own configuration; Aide
// passes the rest per session and never changes that configuration.
message AgentDefaults {
  // "claude" | "codex" | an ACP agent ("deepseek", "gemini", ...)
  string agent = 1;
  string model = 2;
  // The reasoning effort, as the agent names it ("low" … "max").
  string effort = 3;
  // Codex only.
  AgentSpeed speed = 4;
  // ACP agents only: the session mode (machine.v1.AgentStatus.modes).
  string mode = 5;
}

// Persona is a contact (docs/personas.md): a name the owner hands work to,
// with what the sessions it starts run with. It grants nothing: the
// sessions are the owner's, started by the owner's device, and their mode
// is one of the agent's own per-session presets.
message Persona {
  // "p_…", given by the relay.
  string persona_id = 1;
  string name = 2;
  // Its avatar: one of the built-in icons (docs/personas.md §2) and a
  // colour, "#rrggbb".
  string icon = 3;
  string color = 4;
  // Where its sessions run, and with what (aide.session.v1.StartSessionRequest):
  // empty model, effort and mode follow the machine's defaults for the agent.
  string machine_id = 5;
  string project_id = 6;
  string agent = 7;
  string model = 8;
  string effort = 9;
  string mode = 10;
  // The session it talks in now; "" before its first message, or once
  // what its sessions start with changed.
  string session_id = 11;
  google.protobuf.Timestamp updated_at = 12;
}

enum AgentSpeed {
  // The agent's own setting.
  AGENT_SPEED_UNSPECIFIED = 0;
  AGENT_SPEED_STANDARD = 1;
  // Codex's Fast mode (priority processing, more usage per turn).
  AGENT_SPEED_FAST = 2;
}

// RevocationList only ever reduces permissions, so machines accept it from the
// relay control channel and from the owner device over E2E without a root
// signature.
message RevocationList {
  string owner_id = 1;
  repeated string revoked_grant_ids = 2;
  repeated string revoked_machine_ids = 3;
  map<string, uint64> min_grant_versions = 4;
  // Devices signed out (removed, or signed out by a password change): the
  // key ids of their device keys. Their device certs no longer admit them.
  repeated string revoked_device_keys = 5;
}

// Credentials are embedded in the E2E TLS certificate extension and in the
// relay admission hello.
message Credentials {
  reserved 1;
  reserved "root_cert";
  RootChain root_chain = 5;
  // A machine's name, as it calls itself. Not signed: on an end-to-end
  // connection the handshake authenticates it, so an agent picking a
  // machine by name checks it there; anywhere else it is only a hint.
  string machine_name = 6;
  oneof subject {
    Signed machine_cert = 2;
    Signed grant = 3;
    Signed device_cert = 4;
  }
}

// ContactCard names one of the owner's agents, for the others to write to
// (docs/agent-messages.md §4): its client id, the name the owner approved,
// and its client key, which signs its InboxRegistration and its messages.
// A trusted device signs it with its device key. It grants nothing, and
// machines accept it for nothing: they go by grants.
message ContactCard {
  string owner_id = 1;
  string client_id = 2;
  bytes client_public_key = 3;
  string name = 4;
  // "mcp" for a connection whose key a server holds, else "cli".
  string kind = 5;
  google.protobuf.Timestamp issued_at = 6;
  // The kind of agent the owner set (Grant client_category), "" for none,
  // and with "local" its machine.
  string category = 7;
  string category_machine_id = 8;
}

// InboxRegistration is an inbox's key, signed by the inbox's identity key
// (a client key or a machine key). Messages are HPKE-sealed to it.
message InboxRegistration {
  string owner_id = 1;
  // A client id (c_…) or a machine id (m_…).
  string inbox = 2;
  // X25519, 32 bytes.
  bytes inbox_public_key = 3;
  // How the inbox takes its messages, for senders to know what to expect:
  // "session", "hook", "wait", "webhook" or "poll". Informational, but for
  // "her": Her's inbox takes the news of her own sessions and no message
  // from an agent, so senders don't write to it.
  string takes_messages = 4;
  google.protobuf.Timestamp issued_at = 5;
  // When a message reaches the one it is for (docs/agent-messages.md §15):
  // "push", it is woken or its session takes it at once; "turn", in its
  // next turn; "pull", when it next checks its inbox. Set from
  // takes_messages (identity.TierOf); a registration from before has none,
  // and readers work it out the same way.
  string tier = 6;
}

// Contact is one of the owner's inboxes as a sender checks it: an agent's
// card with the cert of the trusted device that signed it, or a machine's
// cert; and the inbox's registration once it has one.
message Contact {
  Signed card = 1;
  Signed device_cert = 2;
  Signed machine_cert = 3;
  Signed registration = 4;
}

// BoundaryPolicy is the owner's information boundary for messages between
// their agents (docs/agent-messages.md §15.5), signed by a trusted device's
// device key: what must not reach which kinds of recipient. The rules
// themselves are the owner's, kept on their side: none is in this
// repository. Senders check a message against it before it goes (refused,
// naming the rule's category); recipients check it again before a model
// reads it (held for the owner). Best effort, not a cryptographic guarantee.
message BoundaryPolicy {
  string owner_id = 1;
  repeated BoundaryRule rules = 2;
  google.protobuf.Timestamp issued_at = 3;
}

message BoundaryRule {
  // The owner's name for what it keeps in ("代理与远程控制", say): shown
  // when it refuses or holds a message; the words it matched never are.
  string category = 1;
  // RE2 regular expressions (Go's syntax); a message matching any is in.
  repeated string patterns = 2;
  // The kinds of recipient it holds for: the coding agent a session runs
  // ("claude", "codex", "deepseek", …), or a CLI agent's own ("claude" for
  // a Claude Code conversation). Empty: every recipient.
  repeated string recipient_kinds = 3;
}

// RoomCharter is what the owner allows a room (ROOMS-DESIGN-2026-11-22):
// its host machine may wake these coding agents, on these machines, in
// these projects, with the room's messages. One of the owner's devices
// signs it as it makes the room; a member machine checks it before it
// starts or goes on with the agent's session for the room.
message RoomCharter {
  string owner_id = 1;
  string room_id = 2;
  string host_machine_id = 3;
  repeated RoomCharterMember members = 4;
  google.protobuf.Timestamp issued_at = 5;
}

message RoomCharterMember {
  string machine_id = 1;
  string agent = 2;
  string project_id = 3;
}
