syntax = "proto3";

package aide.inbox.v1;

import "google/protobuf/timestamp.proto";
import "aide/identity/v1/identity.proto";
import "aide/session/v1/session.proto";

// Messages between the owner's agents, and between agents and sessions
// (docs/agent-messages.md). The relay keeps them sealed: it routes on the
// inbox and never opens them.

// Address is an inbox and, optionally, a session under it: an agent's own
// conversation, or an Aide session on a machine.
message Address {
  // A client id (c_…) or a machine id (m_…).
  string inbox = 1;
  string session = 2;
}

message Message {
  // "msg_" and a ULID, chosen by the sender: recipients drop repeats.
  string message_id = 1;
  Address from = 2;
  Address to = 3;
  google.protobuf.Timestamp sent_at = 4;
  // The message this one answers.
  string in_reply_to = 5;
  string subject = 6;
  // Markdown.
  string text = 7;
  // Set on messages aided writes about a session's turn.
  SessionNews session_news = 8;
  // Set on a managed workspace's request (from a session to its
  // coordinator) and on its replies (from the coordinator or provisioner
  // to the session): docs/workspace-requests.md.
  aide.session.v1.WorkspaceRequest workspace_request = 9;
  // For information only (docs/agent-messages.md §15): it rings no
  // doorbell and starts no turn; the recipient takes it at its next pause
  // (the next turn, the next hook). A turn's news is never one.
  bool fyi = 10;
  // The chain it belongs to: a reply, or a message written because of
  // another, keeps its trace and counts one more hop; anything else starts
  // a chain of its own at hop 1. The recipient holds a chain gone too far
  // (more than 4 hops, or the same chain through it more than 3 times an
  // hour) for the owner, and the owner's own messages start chains anew.
  string trace_id = 11;
  uint32 hop = 12;
  // Set on a room's message (ROOMS-DESIGN-2026-11-22): the room it belongs
  // to on its host machine. A reply goes back to the room's address, the
  // host's inbox with the room as its session.
  RoomRef room = 13;
  // Between machines (G2-b): a room's host waking a coding agent on
  // another machine of the owner's, or that machine sending back what the
  // agent said. Taken only with the room's charter.
  RoomWake room_wake = 14;
  RoomReply room_reply = 15;
}

// RoomWake asks a member machine to hand a room's message to one of its
// coding agents (in the session it talks in for the room, made the first
// time), or to stop it (stop).
message RoomWake {
  aide.identity.v1.Signed charter = 1;
  aide.identity.v1.Signed charter_device_cert = 2;
  string agent = 3;
  string project_id = 4;
  string room_name = 5;
  bool stop = 6;
  // The host's id for this wake, which the reply names.
  string wake_id = 7;
}

// RoomReply is what a coding agent said to a room's message: its turn's
// result, or why it gave none.
message RoomReply {
  string agent = 1;
  string wake_id = 2;
  string failure = 3;
  // The session it talks in for the room, there.
  string session_id = 4;
}

// RoomRef names a room on its host machine.
message RoomRef {
  string room_id = 1;
  string room_name = 2;
  uint32 round = 3;
}

// SessionNews tells whoever asked for a turn how it went: it ended, it
// asks something, or it failed.
message SessionNews {
  // "turn_done", "question" or "failure".
  string kind = 1;
  string session_id = 2;
  string title = 3;
  uint32 turn = 4;
  string machine = 5;
  string project = 6;
  string agent = 7;
  // kind "turn_done": the start of the agent's reply, and what changed.
  string result = 8;
  bool result_truncated = 9;
  aide.session.v1.DiffStat diff_stat = 10;
  // kind "question".
  aide.session.v1.Question question = 11;
  // kind "failure".
  aide.session.v1.FailureKind failure = 12;
  string failure_message = 13;
}

// SignedMessage is what a recipient opens: the message, signed by its
// sender's identity key, and who the sender is.
message SignedMessage {
  aide.identity.v1.Signed message = 1;
  aide.identity.v1.Contact sender = 2;
}
