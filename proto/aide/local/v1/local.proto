message GrantSpec {
  string label = 1;
  repeated string machine_ids = 2;
  repeated string project_ids = 3;
  repeated string agents = 4;
  reserved 5;
  reserved "preset";
  aide.identity.v1.TaskVisibility task_visibility = 6;
  // How long the grant lasts, at most 90 days; 0: it doesn't expire
  // (identity.NoExpiry), and lasts until revoked.
  uint32 ttl_days = 7;
  uint32 max_concurrent_sessions = 8;
  // May run commands on its machines (identity.v1.Grant machine_exec).
  bool machine_exec = 9;
}


message Machine {
  string machine_id = 1;
  string machine_name = 2;
  bool online = 3;
  google.protobuf.Timestamp last_seen = 4;
  // Asked of the machine end to end; unset when it is offline or did not
  // answer.
  aide.machine.v1.MachineStatus status = 5;
  bool local = 6;
  // A trusted device's own machine: that device's root key id.
  string device_key_id = 7;
  // aided's version, as the machine last reported it to the relay.
  string version = 8;
  // Why its sessions and projects cannot be read now ("offline", or the
  // error); empty while they can. Set in Watch only.
  string unreachable = 9;
  // Online, and its sessions and projects are being read: being connected
  // to, or catching up after a while away. What is shown of it meanwhile
  // is last known. Set in Watch only.
  bool syncing = 10;
  // Her on the machine, kept while it was offline: Aide no longer has Her
  // (its data on a machine is in MachineStatus.her).
  reserved 11;
  reserved "her";
  // When this device last knew the machine to be there (its heartbeat:
  // the relay holding its connection, and its Watch answering), this
  // device's clock. Unset for this device's own machine, which always is.
  google.protobuf.Timestamp heard_at = 12;
  // Since when it cannot be read (unreachable set); unset while it can.
  google.protobuf.Timestamp unreachable_since = 13;
  // The recent times it could not be read for at least the lost limit,
  // oldest first (a day's worth, at most 20), kept across restarts: a
  // session's details say it was out of touch then (docs/session-states.md
  // §4). The one under way has no end.
  repeated LostSpan lost_spans = 14;
}

message LostSpan {
  google.protobuf.Timestamp from = 1;
  // Unset while it lasts.
  google.protobuf.Timestamp to = 2;
}

// StateLimits are the limits sessions' states are worked out with
// (docs/session-states.md §3), as this device is set up.
message StateLimits {
  // A machine not heard from for this long is lost (AIDE_LOST_AFTER).
  uint32 lost_after_seconds = 1;
  // A running session with no event for this long is stalled
  // (AIDE_STALL_AFTER).
  uint32 stall_after_seconds = 2;
}

