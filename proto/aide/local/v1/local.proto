syntax = "proto3";

package aide.local.v1;

import "google/protobuf/timestamp.proto";
import "aide/identity/v1/identity.proto";
import "aide/machine/v1/machine.proto";
import "aide/session/v1/session.proto";

// LocalService is served by the aided bundled with the app over a local
// socket. It is the only API the app uses. Anything that adds permissions
// is signed by the server, for this device, which logged in with the
// account and password (docs/accounts.md).
service LocalService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // Watch sends what this device knows of the owner's world (aided's
  // replica, docs/state-sync.md), then each change, until the caller
  // leaves: the screens follow it instead of polling the List calls, which
  // answer from the same replica. A watcher that falls behind is ended
  // (RESOURCE_EXHAUSTED) and should watch again.
  rpc Watch(WatchRequest) returns (stream WatchResponse);

  // Accounts (docs/trusted-devices.md 4.8): a device keeps a profile for
  // each owner it set up or joined, each with its own root key, and uses one
  // at a time, the current one, which every other call acts on.
  rpc ListProfiles(ListProfilesRequest) returns (ListProfilesResponse);
  // Makes another profile current: the current one disconnects and its
  // machine stops; the other connects, unless it is signed out.
  rpc SwitchProfile(SwitchProfileRequest) returns (SwitchProfileResponse);
  // Makes an empty profile current, to set up or join another owner.
  rpc AddProfile(AddProfileRequest) returns (AddProfileResponse);
  // Signs the current profile out: it disconnects and its machine stops,
  // but it keeps its keys, so signing in again needs no other device.
  rpc SignOut(SignOutRequest) returns (SignOutResponse);
  // Signs the current profile in again: on a hosted center with a link
  // code from a browser sign-in to the account that owns it.
  rpc SignIn(SignInRequest) returns (SignInResponse);

  // Onboarding (docs/accounts.md): a new server is set up with the setup
  // code it printed and the account and password it will keep; any other
  // device logs in with the server, the account and the password. Either
  // way the server signs this device in itself: no other device approves,
  // no codes are compared.
  rpc Setup(SetupRequest) returns (SetupResponse);
  rpc LogIn(LogInRequest) returns (LogInResponse);
  // The account: its name; changing it or the password needs the current
  // password, and a new password signs out every other device and agent
  // that logged in.
  rpc GetLogin(GetLoginRequest) returns (GetLoginResponse);
  rpc SetLogin(SetLoginRequest) returns (SetLoginResponse);

  // The owner's devices.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  // Signs another device out: it can no longer connect, and its own machine
  // is removed.
  rpc RemoveDevice(RemoveDeviceRequest) returns (RemoveDeviceResponse);
  // Forgets the owner on this device, after it was removed, so it can log
  // in again: its own machine keeps its projects.
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  // Erases Aide on every device of the owner (docs/erase-everything.md):
  // the server signs the order and keeps it. This device keeps
  // running until FinishErase, to show the others acking.
  rpc EraseEverything(EraseEverythingRequest) returns (EraseEverythingResponse);
  // How an erase stands: each device, machine and agent, and whether it
  // acked. Without an erase id: what erasing everything would reach now.
  rpc EraseStatus(EraseStatusRequest) returns (EraseStatusResponse);
  // Erases this device too: the app opens on its first run.
  rpc FinishErase(FinishEraseRequest) returns (FinishEraseResponse);

  // This Mac as an execution machine.
  rpc SetLocalMachine(SetLocalMachineRequest) returns (SetLocalMachineResponse);

  // Machines.
  rpc ListMachines(ListMachinesRequest) returns (ListMachinesResponse);
  rpc RenameMachine(RenameMachineRequest) returns (RenameMachineResponse);
  rpc SetMachinePaused(SetMachinePausedRequest) returns (SetMachinePausedResponse);
  // What a coding agent's sessions on a machine run with when the client
  // starting one names no model (a setting, no Touch ID).
  rpc SetAgentDefaults(SetAgentDefaultsRequest) returns (SetAgentDefaultsResponse);
  rpc RemoveMachine(RemoveMachineRequest) returns (RemoveMachineResponse);
  // Checks this Mac's coding agents again (installed, version, signed in),
  // in the background: they are only checked when something needs them.
  rpc CheckAgents(CheckAgentsRequest) returns (CheckAgentsResponse);
  // Hides a coding agent a machine lists, or shows it again (SetAgentHidden).
  rpc SetAgentHidden(SetAgentHiddenRequest) returns (SetAgentHiddenResponse);
  // Pauses a coding agent on a machine, or resumes it (SetAgentPaused).
  rpc SetAgentPaused(SetAgentPausedRequest) returns (SetAgentPausedResponse);
  // Files a coding agent a machine lists as a kind, or back to told from
  // what it is (SetAgentCategory).
  rpc SetAgentCategory(SetAgentCategoryRequest) returns (SetAgentCategoryResponse);
  // A machine's git repositories under its home folder, for Add a Project.
  rpc ListMachineRepos(ListMachineReposRequest) returns (ListMachineReposResponse);
  // The folders in one of a machine's folders, for Add a Project.
  rpc ListMachineFolders(ListMachineFoldersRequest) returns (aide.machine.v1.ListFoldersResponse);
  // One fixed turn of a coding agent on a machine (Test).
  rpc TestMachineAgent(TestMachineAgentRequest) returns (aide.machine.v1.TestAgentResponse);
  // Signs a coding agent's command line in on a machine, in a browser that
  // opens there (MachineAdminService.StartAgentLogin, 工单 #51).
  rpc StartMachineAgentLogin(StartMachineAgentLoginRequest) returns (aide.machine.v1.StartAgentLoginResponse);
  // The ops log: the commands agents ran, or were refused, on the
  // machines (docs/machine-ops.md), newest first, as each machine keeps it.
  rpc ListExecLog(ListExecLogRequest) returns (ListExecLogResponse);
  // This Mac's diagnostics as text, for the person to copy and send when
  // something does not work: versions, health, PATH and each coding agent.
  // Nothing leaves the Mac unless they do.
  rpc GetDiagnostics(GetDiagnosticsRequest) returns (GetDiagnosticsResponse);

  // Ends the Computer Control session on this computer's own machine, if
  // one is under way (docs/computer-control.md §4.3): the Mac's menu bar
  // names the device in control and offers this.
  rpc StopScreen(StopScreenRequest) returns (StopScreenResponse);

  // Projects.
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc AddProject(AddProjectRequest) returns (AddProjectResponse);
  rpc RemoveProject(RemoveProjectRequest) returns (RemoveProjectResponse);
  // Names a project as the owner knows it, in place of its id.
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);
  // Sets the DSH permission preset a project's DSH sessions start with
  // unless one is chosen for the session (SetProjectPermission).
  rpc SetProjectPermission(SetProjectPermissionRequest) returns (SetProjectPermissionResponse);

  // Agents.
  rpc ListClients(ListClientsRequest) returns (ListClientsResponse);
  rpc UpdateClient(UpdateClientRequest) returns (UpdateClientResponse);
  // Gives an agent another name: its grant signed again with that alone
  // changed (Touch ID).
  rpc RenameClient(RenameClientRequest) returns (RenameClientResponse);
  // The kind of agent a client is, as the owner sets it (工单 #52).
  rpc SetClientCategory(SetClientCategoryRequest) returns (SetClientCategoryResponse);
  rpc RevokeClient(RevokeClientRequest) returns (RevokeClientResponse);
  // This computer's `aide` CLI, logged in through this device (work order
  // #39, docs/accounts.md §3.1): no account or password asked again.
  // IssueLocalClientGrant is the CLI's own call (`aide auth login
  // --from-app`): it keeps its key, and this device has the server sign
  // and publish an agent grant for that key, as a password login would
  // give. The local socket is this user's alone, and whoever can open it
  // already acts as the owner: it adds no power. The others are the app's
  // row for it: its state, and logging it in or out (out revokes it).
  rpc IssueLocalClientGrant(IssueLocalClientGrantRequest) returns (IssueLocalClientGrantResponse);
  rpc GetLocalCLI(GetLocalCLIRequest) returns (LocalCLI);
  rpc LogInLocalCLI(LogInLocalCLIRequest) returns (LocalCLI);
  rpc LogOutLocalCLI(LogOutLocalCLIRequest) returns (LocalCLI);
  // Agents' doorbells (docs/agent-names.md §7): the webhook rung when
  // messages wait for an agent or a name under it.
  rpc ListWakes(ListWakesRequest) returns (ListWakesResponse);
  rpc SetWake(SetWakeRequest) returns (SetWakeResponse);
  rpc CheckWake(CheckWakeRequest) returns (CheckWakeResponse);
  rpc ClearWake(ClearWakeRequest) returns (ClearWakeResponse);
  rpc OpenWakeLink(OpenWakeLinkRequest) returns (OpenWakeLinkResponse);

  // Contacts (docs/personas.md), kept on the owner's server for all their
  // devices.
  rpc ListPersonas(ListPersonasRequest) returns (ListPersonasResponse);
  rpc SavePersona(SavePersonaRequest) returns (SavePersonaResponse);
  // Forgets a contact; its sessions stay.
  rpc DeletePersona(DeletePersonaRequest) returns (DeletePersonaResponse);
  // TalkToPersona sends a message to a contact: to the session it talks in
  // if that can still take one, else to a new session started with the
  // contact's presets (docs/personas.md §3).
  rpc TalkToPersona(TalkToPersonaRequest) returns (TalkToPersonaResponse);

  // Sessions (read across all reachable machines over E2E).
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  // WatchSessions pushes session changes from every reachable machine as
  // they happen (aided keeps one SessionService.WatchSessions stream per
  // online machine while anyone watches). A watcher that falls behind is
  // ended (RESOURCE_EXHAUSTED) and should watch again.
  rpc WatchSessions(WatchSessionsRequest) returns (stream WatchSessionsResponse);
  rpc StreamSessionEvents(StreamSessionEventsRequest) returns (stream aide.session.v1.SessionEvent);
  // A session's events by seq, as aide.session.v1.SessionService.ListEvents.
  rpc ListSessionEvents(ListSessionEventsRequest) returns (ListSessionEventsResponse);
  // A tool's whole output (aide.session.v1.SessionService.ReadToolOutput).
  rpc ReadToolOutput(ReadToolOutputRequest) returns (stream aide.session.v1.ToolOutputChunk);
  // StartSession starts a session on one of the owner's machines as the
  // owner (created_by "owner"): any project or GitHub repository and coding
  // agent there, as aide.session.v1.SessionService.StartSession checks
  // them (docs/technical-design.md §3.4).
  rpc StartSession(StartSessionRequest) returns (SessionResponse);
  // SendMessage sends a message to a session the owner started; a session
  // an agent started takes messages from that agent only.
  rpc SendMessage(SendMessageRequest) returns (SessionResponse);
  rpc InterruptSession(InterruptSessionRequest) returns (SessionResponse);
  rpc ArchiveSession(ArchiveSessionRequest) returns (SessionResponse);
  rpc UnarchiveSession(UnarchiveSessionRequest) returns (SessionResponse);
  // DeleteSession and RenameSession: aide.session.v1.SessionService's.
  rpc DeleteSession(DeleteSessionRequest) returns (DeleteSessionResponse);
  rpc RenameSession(RenameSessionRequest) returns (SessionResponse);
  // MarkSessionSeen: aide.session.v1.SessionService's, forwarded to the
  // session's machine (docs/session-states.md §7).
  rpc MarkSessionSeen(aide.session.v1.MarkSessionSeenRequest) returns (SessionResponse);
  rpc AnswerQuestion(AnswerQuestionRequest) returns (AnswerQuestionResponse);
  rpc GetDiff(GetDiffRequest) returns (aide.session.v1.GetDiffResponse);
  // aide.session.v1.SessionService.GetSessionInsights, as the owner.
  rpc GetSessionInsights(aide.session.v1.GetSessionInsightsRequest) returns (aide.session.v1.SessionInsights);
  // aide.session.v1.SessionService.PushSession, as the owner.
  rpc PushSession(PushSessionRequest) returns (aide.session.v1.PushSessionResponse);
  // aide.session.v1.SessionService.RollbackSession, as the owner.
  rpc RollbackSession(RollbackSessionRequest) returns (SessionResponse);
  // The DeepSeek Harness sessions Aide did not start, on the machines
  // (aide.machine.v1.MachineAdminService.ListDSHSessions), newest
  // activity first. Read only.
  rpc ListDSHSessions(ListDSHSessionsRequest) returns (ListDSHSessionsResponse);
  // One of them and a page of its conversation
  // (aide.machine.v1.MachineAdminService.ReadDSHSession).
  rpc ReadDSHSession(ReadDSHSessionRequest) returns (aide.machine.v1.ReadDSHSessionResponse);
  // Taking one over (aide.machine.v1.MachineAdminService.SetDSHTakeover,
  // SendDSHMessage, InterruptDSHSession).
  rpc SetDSHTakeover(SetDSHTakeoverRequest) returns (aide.machine.v1.SetDSHTakeoverResponse);
  rpc SendDSHMessage(SendDSHMessageRequest) returns (aide.machine.v1.SendDSHMessageResponse);
  rpc InterruptDSHSession(InterruptDSHSessionRequest) returns (aide.machine.v1.InterruptDSHSessionResponse);
  rpc PrepareDSHBridge(PrepareDSHBridgeRequest) returns (aide.machine.v1.PrepareDSHBridgeResponse);
  // Hands installing the bridge plugin to DSH on the machine (工单 #59).
  rpc InstallDSHBridge(InstallDSHBridgeRequest) returns (aide.machine.v1.InstallDSHBridgeResponse);
  // Rooms (ROOMS-DESIGN-2026-11-22, G2-a), on their host machine. The
  // direct room with a personal agent is found on any machine that hosts it,
  // or made on this device's own machine (else the first one online).
  rpc OpenDirectRoom(OpenDirectRoomRequest) returns (OpenDirectRoomResponse);
  rpc ListRoomMessages(ListRoomMessagesRequest) returns (aide.machine.v1.ListRoomMessagesResponse);
  rpc PostRoomMessage(PostRoomMessageRequest) returns (aide.machine.v1.RoomMessage);
  // Every room on the machines that answer now (G2-b), each with its host.
  rpc ListRooms(ListRoomsRequest) returns (ListRoomsResponse);
  // A room of several bots, on the machine of its coding agents (they must
  // share one), else this device's own machine, else the first one online.
  rpc CreateRoom(CreateRoomRequest) returns (aide.machine.v1.Room);
  rpc UpdateRoom(UpdateRoomRequest) returns (aide.machine.v1.Room);
  rpc StopRoom(RoomRef) returns (aide.machine.v1.Room);
  rpc MarkRoomSeen(RoomRef) returns (aide.machine.v1.Room);
  rpc DeleteRoom(RoomRef) returns (aide.machine.v1.DeleteRoomResponse);
  // What waits at the post office for a machine that hosts rooms, by room:
  // every member's reply (personal agents' too) while it is away (工单 #74).
  rpc ListRoomWaiting(ListRoomWaitingRequest) returns (ListRoomWaitingResponse);
  rpc DSHSessionOptions(DSHSessionOptionsRequest) returns (aide.machine.v1.DSHSessionOptionsResponse);
  // The Claude Code sessions the Claude desktop app lists on the machines
  // (aide.machine.v1.MachineAdminService.ListClaudeSessions), newest
  // activity first; a machine that can't be reached has them as last read,
  // lost.
  rpc ListClaudeSessions(ListClaudeSessionsRequest) returns (ListClaudeSessionsResponse);
  // One of them and a page of its conversation
  // (aide.machine.v1.MachineAdminService.ReadClaudeSession).
  rpc ReadClaudeSession(ReadClaudeSessionRequest) returns (aide.machine.v1.ReadClaudeSessionResponse);
  // The messages each machine holds for the owner before they reach a
  // session, over the machines (aide.machine.v1.MachineAdminService.ListHeldMessages).
  rpc ListHeldMessages(ListHeldMessagesRequest) returns (ListHeldMessagesResponse);
  // Releases one to its session, or discards it.
  rpc ReleaseHeldMessage(ReleaseHeldMessageRequest) returns (aide.machine.v1.ReleaseHeldMessageResponse);
  // A machine's custom agents (MachineAdminService.ListCustomAgents and
  // the rest); this device's own machine in process.
  rpc ListMachineCustomAgents(ListMachineCustomAgentsRequest) returns (aide.machine.v1.ListCustomAgentsResponse);
  rpc SaveMachineCustomAgent(SaveMachineCustomAgentRequest) returns (aide.machine.v1.SaveCustomAgentResponse);
  rpc RemoveMachineCustomAgent(RemoveMachineCustomAgentRequest) returns (aide.machine.v1.RemoveCustomAgentResponse);
  rpc TestMachineCustomAgent(TestMachineCustomAgentRequest) returns (aide.machine.v1.TestCustomAgentResponse);
  // QueryWork counts the work done over a range, by hour or day, from what
  // this device holds of every machine's counts: no machine is asked
  // (docs/work-stats.md §7).
  rpc QueryWork(QueryWorkRequest) returns (QueryWorkResponse);
  // Notifications while the app is not running (the iPhone): this device's
  // push token and notice key, signed with its device key and sent to the
  // relay, which hands them to the owner's machines.
  rpc RegisterPush(RegisterPushRequest) returns (RegisterPushResponse);
}

message WatchRequest {}

message WatchResponse {
  // Set on the first message, which carries everything (and again when
  // the profile changed). Replace what you hold, except sessions: merge
  // those (a later state wins), so older pages already loaded stay.
  bool reset = 1;
  // With reset, and when it changed.
  GetStatusResponse status = 2;
  // Added or changed, and removed, of each kind.
  repeated Machine machines = 3;
  repeated string removed_machine_ids = 4;
  repeated Client clients = 5;
  repeated string removed_grant_ids = 6;
  repeated Device devices = 7;
  repeated string removed_device_key_ids = 8;
  repeated Project projects = 9;
  repeated ProjectRef removed_projects = 10;
  reserved 11, 12;
  reserved "pairings", "removed_pairing_codes";
  // Sessions started or changed, each as it is now; with reset, the first
  // page of every machine's (each one's newest and every unsettled one),
  // also of the machines that cannot be reached now, as last known.
  repeated aide.session.v1.Session sessions = 13;
  repeated string deleted_session_ids = 14;
  // With reset: where older sessions start (ListSessions before).
  aide.session.v1.SessionCursor next = 15;
  // Moves when this device's counts of work changed: ask QueryWork again.
  uint64 work_version = 16;
}

message ListSessionEventsRequest {
  string session_id = 1;
  uint64 after_seq = 2;
  uint64 before_seq = 3;
  uint32 limit = 4;
  aide.session.v1.EventView view = 5;
}

message ListSessionEventsResponse {
  // Oldest first.
  repeated aide.session.v1.SessionEvent events = 1;
  bool has_more_before = 2;
  bool has_more_after = 3;
}

message ReadToolOutputRequest {
  string session_id = 1;
  string call_id = 2;
  // The seq of its ToolResult event: a machine too old for ReadToolOutput
  // gives the output as that event recorded it.
  uint64 seq = 3;
}

message ProjectRef {
  string machine_id = 1;
  string project_id = 2;
}

// ErrorReason is why a call failed as a key (工单 #60), on the error as a
// detail: its message stays English (logs, older apps), and the apps say
// the reason in the owner's language from the key and its args.
message ErrorReason {
  // "no_host_online", "no_room_host_online", …
  string reason = 1;
  map<string, string> args = 2;
}

message ListRoomWaitingRequest {
  string machine_id = 1;
}

message ListRoomWaitingResponse {
  repeated RoomWaiting rooms = 1;
}

message RoomWaiting {
  string room_id = 1;
  uint32 messages = 2;
  // When the oldest of them came in.
  google.protobuf.Timestamp since = 3;
}

message RegisterPushRequest {
  // The APNs device token, hex, or the Mi Push regId; empty stops
  // notifications.
  string token = 1;
  // "production" or "development".
  string environment = 2;
  // X25519 public key (32 bytes) to seal notices to.
  bytes notice_public_key = 3;
  // "question", "failure", "turn_done" (requests to connect always come).
  repeated string kinds = 4;
  // "" for APNs, "mipush" for Xiaomi's Mi Push (an Android phone).
  string service = 5;
}

message RegisterPushResponse {}

message GetStatusRequest {}

message GetStatusResponse {
  bool initialized = 1;
  string owner_id = 2;
  string relay_url = 3;
  bool relay_connected = 4;
  bool local_machine_enabled = 5;
  string local_machine_id = 6;
  string local_machine_name = 7;
  string version = 8;
  reserved 9;
  reserved "connect_address";
  // The relay is a hosted center; its web console at console_url can list
  // and revoke, while adding machines and agents happens only here.
  bool hosted = 10;
  string console_url = 11;
  // This device's id among the owner's devices (Device.key_id).
  string device_key_id = 12;
  // This device is no longer one of the owner's trusted devices: another
  // removed it, or the owner started over. Leave resets it.
  // With machine_only: the relay refuses this machine (it was removed).
  bool removed = 13;
  // This device joined an owner as a machine only, not a trusted device:
  // it approves nothing and sees only its own projects and sessions.
  // initialized stays false; owner_id, relay_url and local_machine_*
  // describe the machine.
  bool machine_only = 14;
  // This profile is signed out (SignOut): set up, but it neither connects
  // nor signs until SignIn.
  bool signed_out = 15;
  // The account this profile belongs to, as the center named it when it
  // was set up, joined or signed in, or since it last connected (for
  // display only).
  string account = 16;
  // This device erased everything (EraseEverything, or an erase order from
  // another): what it did, until another setup.
  Erased erased = 17;
  // A self-hosted relay's MCP address, with its key, to paste into agent
  // products ("" when it serves none, and on the official service).
  string mcp_url = 18;
  reserved 19;
  reserved "signer";
  // The account's picture on the official service (GetAccount), learned
  // each time this device connects: "" when it has none, and on a server
  // of one's own.
  string account_avatar_url = 20;
  // What this core does that an app must not take for granted of an older
  // one (docs/version-skew.md §6.1); none today.
  repeated string abilities = 21;
  // The limits sessions' states are worked out with.
  StateLimits state_limits = 22;
  // The relay is older than its MCP address (GetMCP): it gives none, and
  // updating it does; mcp_url is "" then. False while it is not asked yet,
  // and when it gives none because its MCP is off.
  bool relay_older_than_mcp = 23;
}

message ListProfilesRequest {}

message ListProfilesResponse {
  // Every profile that is set up, and the current one.
  repeated Profile profiles = 1;
}

message Profile {
  string id = 1;
  // Empty: not set up yet (the current profile only).
  string owner_id = 2;
  string relay_url = 3;
  // As GetStatusResponse.account.
  string account = 4;
  bool current = 5;
  bool signed_out = 6;
  bool machine_only = 7;
}

message SwitchProfileRequest {
  string id = 1;
}

message SwitchProfileResponse {}

message AddProfileRequest {}

message AddProfileResponse {
  string id = 1;
}

message SignOutRequest {}

message SignOutResponse {}

message SignInRequest {
  // A hosted center: the link code from the browser sign-in and its PKCE
  // verifier. A self-hosted relay needs neither.
  string claim_code = 1;
  string claim_verifier = 2;
  // As SetupRequest.account.
  string account = 3;
}

message SignInResponse {}

message SetupRequest {
  // The new server, and the setup code it printed on its first start.
  string relay_url = 1;
  string setup_code = 2;
  // The account and password it will keep, as LogInRequest's.
  string account = 3;
  string password = 4;
  // This device's name and platform ("windows", "android", "linux"...).
  string label = 5;
  string platform = 6;
  // Also make this device a machine with this name. Empty: not a machine.
  string local_machine_name = 7;
}

message SetupResponse {
  string owner_id = 1;
}

message LogInRequest {
  // The owner's server, as typed (with or without https://; a connection
  // address works too). Empty: $AIDE_SERVER, else refused (no build names
  // a server).
  string relay_url = 1;
  string account = 2;
  string password = 3;
  // As in SetupRequest.
  string label = 4;
  string platform = 5;
  string local_machine_name = 6;
  // Log in as a machine only: this computer runs tasks for the owner, named
  // label, but is not one of the owner's devices.
  bool machine_only = 7;
}

message LogInResponse {
  string owner_id = 1;
}

message GetLoginRequest {}

message GetLoginResponse {
  string account = 1;
  // The server to type on a new device, computer or agent.
  string server = 2;
  // A password login from before accounts waits to be converted: SetLogin
  // with its password (current_password) does it.
  bool convert = 3;
  // Logging in is turned off.
  bool off = 4;
}

message SetLoginRequest {
  string current_password = 1;
  // Unset: kept.
  string account = 2;
  string new_password = 3;
  bool off = 4;
}

message SetLoginResponse {
  // Devices and agents signed out by a new password.
  uint32 signed_out = 1;
}

message Device {
  string key_id = 1;
  string label = 2;
  string platform = 3;
  bool this_device = 4;
  // The device's own machine, if it is one.
  string machine_id = 5;
  bool machine_online = 6;
  // Set up before accounts: a root key of its own in the root cert.
  bool legacy = 7;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message RemoveDeviceRequest {
  string key_id = 1;
  // Her's data on the device's own machine is erased first, while it
  // answers.
  bool erase_her = 2;
}

message RemoveDeviceResponse {
  uint32 reissued_machines = 1;
  uint32 reissued_grants = 2;
}

message LeaveRequest {}

message LeaveResponse {}

message EraseEverythingRequest {}

message EraseEverythingResponse {
  string erase_id = 1;
}

message EraseStatusRequest {
  string erase_id = 1;
}

message EraseStatusResponse {
  // What there was when it began, and which acked.
  repeated EraseItem items = 1;
  // Without an erase id, on a center: the account's email, which the owner
  // types to confirm ("" on a self-hosted relay: its address is typed).
  string account = 2;
}

message EraseItem {
  // "device", "machine" or "agent". A trusted device that is a machine too
  // is one device.
  string kind = 1;
  string name = 2;
  // This device.
  bool this_device = 3;
  bool done = 4;
  // Online when the erase began (a machine, or a device's own machine): it
  // erases within seconds. The others erase the next time they connect.
  bool online = 5;
}

message FinishEraseRequest {}

message FinishEraseResponse {}

// What the last erase did, for the app to say once on its first run.
message Erased {
  string erase_id = 1;
  google.protobuf.Timestamp at = 2;
  // Devices, machines and agents that had not acked when this one erased:
  // they erase the next time they connect.
  repeated string pending = 3;
  // Worktrees with uncommitted changes, kept.
  repeated string kept_worktrees = 4;
  // The trusted device that erased everything, when it was another one.
  string by = 5;
}

message SetLocalMachineRequest {
  bool enabled = 1;
  string machine_name = 2;
}

message SetLocalMachineResponse {
