  string id = 1;
  string machine_id = 2;
  string bot_id = 3;
  string text = 4;
  repeated string local_paths = 5;
  google.protobuf.Timestamp created_at = 6;
  // Why the last try failed, when one did.
  string error = 7;
  HerReply reply = 8;
}

