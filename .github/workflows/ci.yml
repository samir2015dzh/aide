name: ci
on:
  push:
    branches: [main]
  pull_request:
  # By hand, on any branch: Windows work is tried on Windows runners there
  # before it reaches main (docs/windows.md).
  workflow_dispatch:
  # Every day, the whole Linux line with race-detector binaries (work order #33's
  # safety net): whatever a pull request's selective run left out is raced here
  # and on main's push. The Windows lines do not run on it.
  schedule:
    - cron: '17 3 * * *'
# A pull request's newer commit cancels its older run; main's pushes and the
# daily run are never cancelled half way (they are where every test gets raced).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # What the Linux line runs (work order #33): everything on main's pushes, the
  # daily run and runs by hand; on a pull request, the unit tests and race
  # detector its changes reach (scripts/ci_select.py, which runs everything
  # when in doubt). Its log and summary list what runs and what is skipped.
  select:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      unit: ${{ steps.select.outputs.unit }}
      e2e: ${{ steps.select.outputs.e2e }}
      race: ${{ steps.select.outputs.race }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - id: select
        run: python3 scripts/ci_select.py --base "origin/${GITHUB_BASE_REF:-main}"
  go:
    needs: select
    strategy:
      # Linux alone (the owner's servers run Debian; there's no Mac app): kept by
      # the owner's ruling, 2026-11-18, while Windows runs everything else.
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Docs or the Android app alone (select's docs mode): nothing here reads them.
      - name: lint
        if: needs.select.outputs.mode != 'docs'
        run: make lint
      - name: contract compatibility
        if: github.event_name == 'pull_request' && needs.select.outputs.mode != 'docs'
        run: go tool buf breaking --against '.git#branch=origin/main'
      # make test's packages, or a pull request's share of them (select).
      - name: unit tests
        if: needs.select.outputs.unit != ''
        run: go test ${{ needs.select.outputs.unit }} -count=1
      # The relay image builds from its own context (.dockerignore): built here,
      # not pushed, so that a package that context leaves out fails on the PR,
      # not first in relay-image (2026-11-20: apps/dsh-bridge).
      - name: relay image
        if: needs.select.outputs.mode != 'docs'
        run: docker build -f deploy/relay/Dockerfile .
      - name: installer terminal interaction
        if: needs.select.outputs.mode != 'docs'
        run: python3 scripts/test_install.py
      # The agents' CLI as this commit builds it, for a dispatcher to fetch
      # from the run before a release carries it (work order #15): the same
      # flags as scripts/release.sh, so no build names a server.
      - name: agent CLI
        if: needs.select.outputs.mode != 'docs'
        run: |
          v="$(git describe --tags --always)-ci"
          for p in linux/amd64 linux/arm64 windows/amd64; do
            ext=""; [ "${p%/*}" = windows ] && ext=.exe
            GOOS=${p%/*} GOARCH=${p#*/} CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/samir2015dzh/aide/internal/machine.Version=${v#v}" \
              -o "dist/cli/aide-${p%/*}-${p#*/}$ext" ./cmd/aide
          done
          (cd dist/cli && sha256sum aide-* > checksums.txt)
      - uses: actions/upload-artifact@v4
        if: needs.select.outputs.mode != 'docs'
        with:
          name: aide-cli
          path: dist/cli/
          retention-days: 30
      # The desktop app's TypeScript: types and unit tests (they ran on
      # the macOS app job, gone with the Mac app). After the end-to-end tests:
      # with pnpm here, TestDesktop would run, and Electron's sandbox can't on
      # this runner (the desktop's end-to-end tests run on windows-app).
      # pnpm first, at package.json's packageManager (no version here), so setup-node can cache its store.
      - uses: pnpm/action-setup@v4
        if: needs.select.outputs.mode != 'docs'
      - uses: actions/setup-node@v4
        if: needs.select.outputs.mode != 'docs'
        id: setup-node-cache
        with:
          node-version: 24
          cache: pnpm
      # One readable line per cache, in the log and the run summary.
      - name: cache hit
        if: needs.select.outputs.mode != 'docs'
        shell: bash
        run: |
          echo "cache hit, setup-node (pnpm) in go: ${{ steps.setup-node-cache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: types and unit tests (TypeScript)
        if: needs.select.outputs.mode != 'docs'
        run: |
          pnpm install --frozen-lockfile
          pnpm -r typecheck
          pnpm --filter @aide/core test
          pnpm --filter @aide/desktop test
          pnpm --filter @aide/dsh-bridge test
  # The end-to-end suite (make e2e), split into shards that run side by side:
  # scripts/e2e_shards.py gives each shard its tests, balanced by the times in
  # scripts/e2e_shard_times.json, and e2e-ledger checks that every test ran
  # exactly once. No pnpm in these jobs: with it TestDesktop would run, and
  # Electron's sandbox can't on this runner (it runs on windows-app).
  e2e:
    name: e2e (${{ matrix.shard }}/6)
    needs: select
    if: needs.select.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A red shard leaves the others running: one run shows every failure.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end (scripted agents)
        shell: bash
        env:
          # Race-detector binaries (a data race fails the test): on main's pushes
          # and the daily run; on a pull request, when its changes reach any of
          # them (select).
          AIDE_E2E_RACE: ${{ needs.select.outputs.race }}
        run: |
          go test ./e2e/ -list '^Test' > "$RUNNER_TEMP/e2e-tests.txt"
          run=$(python3 scripts/e2e_shards.py run-pattern --of ${{ strategy.job-total }} --shard ${{ matrix.shard }} "$RUNNER_TEMP/e2e-tests.txt")
          echo "this shard: $run"
          echo "race detector: ${AIDE_E2E_RACE:-off} (1 = on, every binary)"
          # make e2e, with this shard's tests and -v for the ledger.
          go test ./e2e/ -count=1 -timeout 45m -v -run "$run" 2>&1 | tee "$RUNNER_TEMP/e2e.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/e2e.log
          retention-days: 7
  # Every listed test ran exactly once, in the shard it was given to; the
  # summary carries the times measured, for scripts/e2e_shard_times.json.
  e2e-ledger:
    needs: [select, e2e]
    # Not on a cancelled run: its shards' logs are cut short, and would read as missing tests.
    if: ${{ !cancelled() && needs.select.outputs.e2e == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: e2e-shard-*
          path: ${{ runner.temp }}/shards
      - name: every test exactly once
        shell: bash
        run: |
          go test ./e2e/ -list '^Test' > "$RUNNER_TEMP/e2e-tests.txt"
          logs=()  # one per shard of the e2e matrix, in order
          for i in 1 2 3 4 5 6; do logs+=("$RUNNER_TEMP/shards/e2e-shard-$i/e2e.log"); done
          python3 scripts/e2e_shards.py ledger --of 6 "$RUNNER_TEMP/e2e-tests.txt" "${logs[@]}" | tee "$RUNNER_TEMP/ledger.txt"
          { echo "race detector in every shard: ${RACE:-off} (1 = on, every binary)"; echo '```'; cat "$RUNNER_TEMP/ledger.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
        env:
          RACE: ${{ needs.select.outputs.race }}
  # One check for the whole Linux line, whatever select skipped: red when any
  # part of it failed, green when each passed or was skipped by select.
  linux:
    needs: [select, go, e2e, e2e-ledger]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: select=${{ needs.select.result }} go=${{ needs.go.result }} e2e=${{ needs.e2e.result }} e2e-ledger=${{ needs.e2e-ledger.result }}
          MODE: ${{ needs.select.outputs.mode }}
        run: |
          echo "mode: $MODE; $RESULTS"
          for r in $RESULTS; do
            case "$r" in select=success|*=success|*=skipped) ;; *) echo "::error::$r"; exit 1 ;; esac
          done
          case "$RESULTS" in select=success*) ;; *) echo "::error::select did not succeed"; exit 1 ;; esac
  # Windows (docs/windows.md): what is ported so far.
  windows:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: unit tests
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1
      - name: install.ps1
        run: go test ./e2e -run '^TestWindowsInstall$' -count=1 -v
  # The end-to-end suite on Windows, sharded like Linux e2e (work order #125;
  # TestDesktop is owned by windows-app so it is excluded here to prevent
  # duplicate execution). Its failures do not fail the run yet.
  windows-e2e:
    name: windows-e2e (${{ matrix.shard }}/4)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: end-to-end (scripted agents)
        shell: bash
        run: |
          go test ./e2e/ -list '^Test' > "$RUNNER_TEMP/e2e-tests.txt"
          run=$(python3 scripts/e2e_shards.py run-pattern --exclude TestDesktop --of ${{ strategy.job-total }} --shard ${{ matrix.shard }} "$RUNNER_TEMP/e2e-tests.txt")
          echo "this windows shard: $run"
          go test ./e2e/ -count=1 -timeout 20m -v -run "$run" 2>&1 | tee "$RUNNER_TEMP/windows-e2e.log"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-e2e-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/windows-e2e.log
            ${{ runner.temp }}/e2e-tests.txt
          retention-days: 7
  # Verifies every non-desktop Windows e2e test ran exactly once across the 4 shards (#125).
  windows-e2e-ledger:
    needs: [windows-e2e]
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-e2e-shard-*
          path: ${{ runner.temp }}/win-shards
      - name: every windows e2e test exactly once
        shell: bash
        run: |
          list="$RUNNER_TEMP/win-shards/windows-e2e-shard-1/e2e-tests.txt"
          for i in 2 3 4; do cmp -s "$list" "$RUNNER_TEMP/win-shards/windows-e2e-shard-$i/e2e-tests.txt"; done
          logs=()
          for i in 1 2 3 4; do logs+=("$RUNNER_TEMP/win-shards/windows-e2e-shard-$i/windows-e2e.log"); done
          python3 scripts/e2e_shards.py ledger --exclude TestDesktop --of 4 "$list" "${logs[@]}" | tee "$RUNNER_TEMP/win-ledger.txt"
          { echo "windows-e2e shards (TestDesktop owned by windows-app)"; echo '```'; cat "$RUNNER_TEMP/win-ledger.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  # The desktop app (Electron): types, unit tests, and
  # their end-to-end tests driving the real app against the real daemon.
  # The desktop app on Windows (docs/windows.md, W2): its end-to-end spec
  # against the real daemon, then the package, installed in Developer Mode
  # with its aliases checked. Its failures do not fail the run yet.
  windows-app:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # pnpm first, at package.json's packageManager (no version here), so setup-node can cache its store.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        id: setup-node-cache
        with:
          node-version: 24
          cache: pnpm
      # One readable line per cache, in the log and the run summary.
      - name: cache hit
        shell: bash
        run: |
          echo "cache hit, setup-node (pnpm) in windows-app: ${{ steps.setup-node-cache.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
      - run: pnpm install --frozen-lockfile
      - name: end-to-end (desktop app)
        run: go test ./e2e -run '^TestDesktop$' -count=1 -v -timeout 30m
      - name: package
        run: node apps/desktop/scripts/package-win.mjs
      - name: install it, open it, uninstall it
        shell: pwsh
        run: apps/desktop/scripts/check-windows-setup.ps1 dist/Aide-windows-x64-setup.exe
      # Cache the older 0.0.1 test installer + its throwaway 127.0.0.1 test keypair across runs when
      # updater/packaging inputs did not change (work order #125); the newer 0.0.2 build is always built fresh.
      - name: cache older update installer
        id: cache-older-update
        uses: actions/cache@v4
        with:
          path: |
            dist/older-cache
          key: win-update-older-0.0.1-${{ hashFiles('apps/desktop/scripts/package-win.mjs', 'apps/desktop/scripts/windows-*.mjs', 'apps/desktop/src/main/updater.ts', 'apps/desktop/src/main/platform/win.ts', 'apps/desktop/package.json', 'go.sum') }}
      # Two builds, the older updating to the newer from a feed signed with a key of the test's.
      - name: update between two builds
        shell: bash
        run: |
          echo "cache hit, older update installer (0.0.1): ${{ steps.cache-older-update.outputs.cache-hit }}" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p dist/older-cache
          export AIDE_UPDATE_FEED=http://127.0.0.1:8765 AIDE_RELEASE_URL=http://127.0.0.1:8765
          export AIDE_RELEASE_PUBKEY_FILE="dist/older-cache/test.pub" RELEASE_SIGNING_KEY_FILE="dist/older-cache/test.key"
          if [ ! -f dist/older-cache/Aide-windows-x64-setup.exe ] || [ ! -f dist/older-cache/test.key ] || [ ! -f dist/older-cache/test.pub ]; then
            openssl ecparam -name prime256v1 -genkey -noout -out "$RELEASE_SIGNING_KEY_FILE"
            openssl ec -in "$RELEASE_SIGNING_KEY_FILE" -pubout -out "$AIDE_RELEASE_PUBKEY_FILE"
            VERSION=0.0.1 AIDE_DIST=dist/older node apps/desktop/scripts/package-win.mjs
            cp dist/older/Aide-windows-x64-setup.exe dist/older-cache/Aide-windows-x64-setup.exe
          fi
          VERSION=0.0.2 AIDE_DIST=dist/newer node apps/desktop/scripts/package-win.mjs
          pwsh -File apps/desktop/scripts/check-windows-update.ps1 dist/older-cache/Aide-windows-x64-setup.exe dist/newer 0.0.2
      - uses: actions/upload-artifact@v4
        with:
          name: Aide-windows-setup
          path: dist/Aide-windows-*-setup.exe
