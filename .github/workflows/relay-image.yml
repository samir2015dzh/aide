name: relay-image
# The relay image for linux/amd64 and linux/arm64, on ghcr.io as
# <owner>/aide-relay. A release (release.yml) pushes its
# version; promoting it (promote.yml) makes that latest. Run by hand from
# the Actions page, it pushes the branch it runs on as edge, to try the
# image before a release. Not to Docker Hub: samir2015dzh there is upstream's.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: tags
        env:
          VERSION: ${{ inputs.version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          {
            echo "list<<EOF"
            if [ -n "$VERSION" ]; then
              echo "ghcr.io/$OWNER/aide-relay:$VERSION"
            else
              echo "ghcr.io/$OWNER/aide-relay:edge"
            fi
            echo EOF
            # The layers, kept on GHCR beside the image (not in the Actions cache quota).
            echo "cache=ghcr.io/${OWNER,,}/aide-relay:buildcache"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cross-compiled in the Dockerfile: ARM servers too, no emulation.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.tags.outputs.cache }},mode=max
