version: v2
plugins:
  - local: packages/proto/node_modules/.bin/protoc-gen-es
    out: packages/proto/src/gen
    opt: target=ts
inputs:
  - directory: proto
    paths:
      - proto/aide/local
      - proto/aide/her
      - proto/aide/session
      - proto/aide/identity
      - proto/aide/machine
      - proto/aide/screen
      - proto/aide/options
